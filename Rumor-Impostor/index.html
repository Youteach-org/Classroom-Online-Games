<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7efe2">
  <title>Rumor Impostor · Student</title>
  <link rel="stylesheet" href="./styles.css?v=auto-join-1">
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark">?</div>
        <div>
          <h1>Rumor Impostor</h1>
          <p class="sub">Student game · Unit 7</p>
        </div>
      </div>
    </header>

    <div id="status" class="status"></div>

    <div class="grid">
      <section class="panel">
        <div id="joinView">
          <h2>Join the game</h2>
          <div class="form">
            <label class="wide">Your name
              <input id="studentName" autocomplete="name" placeholder="Name">
            </label>
            <label>Nickname / ID
              <input id="studentLabel" placeholder="Optional">
            </label>
            <label id="roomCodeLabel">Room code
              <input id="roomCode" maxlength="6" placeholder="ABC123">
            </label>
          </div>
          <button id="joinBtn" class="btn primary" style="margin-top:12px">Enter game</button>
        </div>
        <div id="gameView" class="hidden"></div>
      </section>

      <section class="panel">
        <h2>Your team</h2>
        <div id="teamView"><p class="note">Your team will appear after the teacher forms teams.</p></div>
      </section>
    </div>
  </main>
  <script type="module" src="./student.js?v=auto-join-1"></script>
</body>
</html>
