<style>

#options{height:34%;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4% 2.4%}.option{position:relative;border:2px solid #5688d8;border-radius:14px;text-align:left;background:linear-gradient(180deg,#183d73 0%,#14235b 45%,#15134f 100%);padding:2% 4%;font-size:clamp(15px,1.55vw,24px);font-weight:900;color:#fff;line-height:1.12;overflow:hidden}.option .letter{color:#ffdb65;margin-right:10px}.option:hover:not(:disabled){border-color:#fff0a4;background:#233c8d}.option.selected{border-color:#ffd868!important;background:linear-gradient(#744d09,#9f5b0c);box-shadow:0 0 18px #f2bc3988}.option.correct{border-color:#90ffb6!important;background:linear-gradient(#146e54,#09563f)!important;box-shadow:0 0 18px #30ff9388}.option.wrong{border-color:#ffa6a6!important;background:linear-gradient(#802544,#4b1631)!important}.option.hidden{visibility:hidden}

#message{height:12%;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(14px,1.3vw,20px);font-weight:800;padding:1% 2%;color:#e9f6ff;background:#111d42b3;border:1px solid #426eb366;border-radius:11px;overflow:auto}
#actions{height:12%;min-height:0;display:flex;gap:1.5%}.action{flex:1;background:linear-gradient(#4b56bb,#27246c);border:2px solid #779ded;border-radius:11px;color:white;text-transform:uppercase;font-size:clamp(12px,1.12vw,17px);font-weight:900}.action.primary{background:linear-gradient(#f2dc71,#b8761e);border-color:#fff2aa;color:#161029}.action.next{background:linear-gradient(#21bcb7,#126c86);border-color:#6cffff}
footer{height:9%;border-top:1px solid #346ab5a3;background:#020919aa;display:flex;align-items:center;justify-content:space-between;padding:0 2.2%;gap:2%}#scores{display:flex;gap:1.5%;width:100%;overflow:hidden}.score{font-size:clamp(10px,1.1vw,17px);font-weight:900;color:#dce9ff;white-space:nowrap}.score b{color:#ffdc70}#footright{font-size:clamp(10px,1vw,15px);white-space:nowrap;color:#7fdff2}
#overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(155deg,#070d28fa,#111b55fa 55%,#1a0e35fa);display:flex;align-items:center;justify-content:center;padding:6%}#overlay.hidden{display:none}.modal{width:85%;max-height:95%;overflow:auto;background:#0e1c50;border:3px solid #58dcfa;border-radius:22px;padding:4% 5%;box-shadow:0 0 40px #1eacfb66;text-align:center}.modal h1{font-size:clamp(29px,3.5vw,50px);line-height:1.02;color:#ffdf6a;text-shadow:2px 3px #783c9c;margin:0 0 3%}.modal p{font-size:clamp(14px,1.5vw,22px);line-height:1.35;margin:2% 0}.modal label{font-size:clamp(14px,1.5vw,23px);font-weight:800}.modal select{margin:10px;background:#ecf9ff;color:#071529;border:2px solid #8debff;border-radius:7px;padding:7px 14px;font-size:20px}.modal button{font-size:clamp(14px,1.6vw,24px);font-weight:900;color:#08163f;border-radius:12px;background:linear-gradient(#fff7bc,#e1ae35);border:2px solid white;padding:13px 25px;margin:1%}.modal .minor{background:linear-gradient(#adc8f6,#6f90cd)}.modal small{display:block;font-size:clamp(11px,1.08vw,16px);color:#a3c7f5;line-height:1.45;margin-top:15px}
#pollChart{margin:0 auto;display:grid;grid-template-columns:45px 1fr 55px;gap:9px;align-items:center;width:min(90%,560px);font-weight:900;font-size:clamp(13px,1.2vw,20px)}.bar{background:#0d1945;height:22px;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5d78e2,#53d8fd);border-radius:8px}
@media(max-width:660px){.hosttools .tool{padding:5px}.brand strong{font-size:19px}.modal{width:98%}.chip{padding:3px}.level{padding:0 3px}.option{font-size:11px}#question{font-size:14px}}
</style>

<body>
<div id="stage">
<header><div class="brand"><small>COG • CLASSROOM ONLINE GAMES • OFFLINE EDITION</small><strong>PHRASAL VERB MILLIONAIRE</strong><em>UNIT 10 / GLOBAL TIES / BLOCK 3</em></div><div class="hosttools"><button class="tool" id="fullBtn" title="F">⛶ SCREEN</button><button class="tool" id="soundBtn" title="M">♪ SOUND: ON</button><button class="tool" id="restartBtn">↻ NEW GAME</button></div></header>
<div id="game"><aside id="left"><div id="ladder-title">THE MILLION-POINT LADDER</div><div id="ladder"></div></aside><main id="right"><div id="topline"><span id="turn">QUESTION 1/15</span><div class="selector" id="teamSelect"></div><span id="timer">00:30</span></div><div id="question" aria-live="polite">Ready to play?</div><div id="options"></div><div id="lifelines"><button class="life" id="fifty" title="5">50 : 50</button><button class="life" id="poll">ASK THE AUDIENCE</button><button class="life" id="phone" title="H">PHONE A FRIEND</button></div><div id="message" aria-live="polite">Your laptop is the host. Choose a team and play.</div><div id="actions"><button class="action" id="lock">FINAL ANSWER</button><button class="action primary" id="reveal">REVEAL ANSWER</button><button class="action next" id="next">NEXT QUESTION →</button></div></main></div>

</div>
<script>
'use strict';
// Questions are authored for classroom practice from Connectivity Level 5, Unit 10, pp.102–105.
// Each level has two alternatives, chosen randomly at the start of a new game.
const bank = [
[{q:'The gas station has _____ fuel. No more is available!',o:['run out of','put up with','come up with','carry out'],a:0,e:'run out of = use the entire supply of something.'},{q:'After the storm, stores _____ bottled water.',o:['came down with','ran out of','laid off','wiped out'],a:1,e:'run out of = have no more left.'}],
[{q:'She _____ a terrible cold last weekend.',o:['came up with','came down with','brought about','carried out'],a:1,e:'come down with = become ill with a disease.'},{q:'Many students _____ colds after the holidays.',o:['come down with','lay off','wipe out','go after'],a:0,e:'come down with is for becoming sick.'}],
[{q:'The company had to _____ 200 workers.',o:['go without','come across','lay off','put up with'],a:2,e:'lay off = end workers’ employment for economic reasons.'},{q:'During the economic crisis, several firms _____ staff.',o:['carried out','laid off','came up with','ran out of'],a:1,e:'lay off = dismiss employees because of economic conditions.'}],
[{q:'I cannot _____ this terrible noise anymore!',o:['wipe out','put up with','run out of','bring about'],a:1,e:'put up with = tolerate a difficult situation.'},{q:'Would you _____ a six-hour traffic jam?',o:['come down with','lay off','put up with','go after'],a:2,e:'put up with = tolerate without complaining.'}],
[{q:'The rescue team will _____ the plan tomorrow.',o:['carry out','come down with','go without','run out of'],a:0,e:'carry out = perform or accomplish a plan.'},{q:'Volunteers _____ the project successfully.',o:['carried out','came down with','ran out of','put up with'],a:0,e:'carry out = accomplish a task or project.'}],
[{q:'Scientists have _____ a new solution.',o:['gone without','come up with','laid off','come down with'],a:1,e:'come up with = invent or think of an idea.'},{q:'Can you _____ an original idea for the campaign?',o:['come up with','run out of','put up with','wipe out'],a:0,e:'come up with = create a new idea.'}],
[{q:'New regulations could _____ major changes.',o:['lay off','bring about','go without','come across'],a:1,e:'bring about = cause something to happen.'},{q:'The invention of the Internet _____ enormous social changes.',o:['brought about','came down with','ran out of','put up with'],a:0,e:'bring about = cause a result.'}],
[{q:'The flood could _____ the entire village.',o:['wipe out','put up with','go without','lay off'],a:0,e:'wipe out = destroy completely.'},{q:'An effective vaccine helped _____ the disease.',o:['come up with','carry out','wipe out','come down with'],a:2,e:'wipe out = eliminate completely.'}],
[{q:'During the blackout, we had to _____ electricity.',o:['lay off','go without','bring about','wipe out'],a:1,e:'go without = live without something needed or usual.'},{q:'After losing his wallet, he had to _____ lunch.',o:['go without','carry out','put up with','come down with'],a:0,e:'go without = do without something.'}],
[{q:'Which sentence is correct?',o:['Turn off it.','Turn it off.','Turn off them.','Turn they off.'],a:1,e:'Separable: a pronoun must go between verb and particle.'},{q:'Replace “the tablets” with a pronoun: “Turn off the tablets.”',o:['Turn off they.','Turn them off.','Turn off them.','Turn it off.'],a:1,e:'turn off is separable: turn THEM off.'}],
[{q:'Choose the correct sentence.',o:['I came them across.','I came across them.','I them came across.','I came across they.'],a:1,e:'come across is inseparable: object comes after the particle.'},{q:'“We came across interesting signs.” Replace the object.',o:['We came them across.','We came across them.','We came across they.','We them came across.'],a:1,e:'come across is inseparable: came across THEM.'}],
[{q:'Which is the correct pronoun order?',o:['Give up them.','Give them up.','Give they up.','Them give up.'],a:1,e:'give up is separable: give THEM up.'},{q:'“She tried out the new game.” Replace the object.',o:['She tried out it.','She tried it out.','She tried them out.','She it tried out.'],a:1,e:'try out is separable: try IT out.'}],
[{q:'The teacher persuaded the students. Which is correct?',o:['Talked into them participating.','Talked them into participating.','Talked into participating them.','Talked they into participating.'],a:1,e:'talk someone into something is always separated.'},{q:'Which sentence uses “talk into” correctly?',o:['We talked him into joining.','We talked into him joining.','We talked joining into him.','We talked into joining him.'],a:0,e:'talk HIM into joining: always separated.'}],
[{q:'Which phrasal verb is INSEPARABLE?',o:['turn off','give up','go after','pick up'],a:2,e:'go after is inseparable: go after them (NOT go them after).'}, {q:'Which phrasal verb is SEPARABLE?',o:['put up with','come across','try on','run out of'],a:2,e:'try on: try the jacket on / try it on.'}],
[{q:'Which sentence is completely correct?',o:['They came up it with.','We ran it out of.','She carried it out.','He put them up with.'],a:2,e:'carry out is separable, so “carried it out” is correct.'},{q:'Which sentence is completely correct?',o:['We came up with it.','We came it up with.','We laid off them.','We went it without.'],a:0,e:'come up with is inseparable, so its object goes after with.'}]
];
const prizes=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
let questions=[],index=0,selected=-1,locked=false,revealed=false,teams=[],active=0,used={fifty:false,poll:false,phone:false},hidden=[],sound=true,timerOn=false,seconds=30,clock=null,started=false;
const $=s=>document.querySelector(s), el=(s)=>document.getElementById(s);
function question(){return questions[index]}
function format(n){return n.toLocaleString('en-US')}
function tone(f,d=.13,v=.045){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;const a=window.__audio||(window.__audio=new AC());if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.01)}catch(_){}}
function playSuccess(){tone(550,.12);setTimeout(()=>tone(710,.14),140);setTimeout(()=>tone(890,.27),300)}
function updateTimer(){el('timer').textContent=timerOn?`00:${String(seconds).padStart(2,'0')}`:'∞';el('timer').className=(timerOn&&seconds<=10)?'danger':''}
function stopClock(){if(clock){clearInterval(clock);clock=null}}function startClock(){stopClock();seconds=30;updateTimer();if(timerOn){clock=setInterval(()=>{if(!locked&&!revealed&&seconds>0)seconds--;updateTimer();if(seconds===0){stopClock();el('message').textContent='TIME! Teacher can still choose or reveal the answer.';tone(210,.4)}},1000)}}
function setup(){stopClock();el('overlay').classList.remove('hidden');el('modal').innerHTML=`<h1>WHO WANTS TO BE A<br>PHRASAL VERB MILLIONAIRE?</h1><p>OFFLINE CLASSROOM EDITION · UNIT 10</p><label>How many teams? <select id="teamCount">${[2,3,4,5,6].map(x=>`<option value="${x}" ${x===4?'selected':''}>${x}</option>`).join('')}</select></label><br><label><input id="timerChoice" type="checkbox"> Optional 30-second timer</label><p><button id="startGame">START THE SHOW ▶</button></p><small>No Wi-Fi · No server · No student phones · No internet assets<br>Keyboard: 1–4 answer · Enter confirm/reveal · N next · 5 fifty-fifty · H friend · F full screen · M sound</small>`;el('startGame').onclick=()=>start(Number(el('teamCount').value),el('timerChoice').checked)}
function start(count,t){timerOn=t;questions=bank.map(pair=>pair[Math.floor(Math.random()*pair.length)]);teams=Array.from({length:count},(_,i)=>({name:'TEAM '+(i+1),points:0}));active=0;index=0;used={fifty:false,poll:false,phone:false};started=true;el('overlay').classList.add('hidden');render()}
function render(){selected=-1;locked=false;revealed=false;hidden=[];if(index>=questions.length){finish();return}const q=question();el('turn').textContent=`QUESTION ${index+1}/15`;el('question').textContent=q.q;el('options').innerHTML=q.o.map((text,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}:</span>${escapeHTML(text)}</button>`).join('');el('options').querySelectorAll('button').forEach(x=>x.onclick=()=>choose(+x.dataset.i));el('ladder').innerHTML=prizes.map((p,i)=>`<div class="level ${i===index?'current':i<index?'past':''} ${[4,9,14].includes(i)?'milestone':''}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${format(p)} PTS</span></div>`).reverse().join('');el('teamSelect').innerHTML=teams.map((x,i)=>`<button class="chip ${i===active?'active':''}" data-t="${i}">${x.name}</button>`).join('');el('teamSelect').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(locked||revealed)return;active=Number(b.dataset.t);renderTeams()});renderTeams();el('message').textContent='Select a team and choose A, B, C or D.';setButtonState();updateLifelines();startClock();tone(300,.12)}
function renderTeams(){el('teamSelect').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===active));el('scores').innerHTML=teams.map((t,i)=>`<span class="score">${i===active?'◆':'◇'} ${t.name}: <b>${format(t.points)}</b></span>`).join('')}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){if(locked||revealed||hidden.includes(i))return;selected=i;el('options').querySelectorAll('.option').forEach((b,j)=>b.classList.toggle('selected',i===j));el('message').textContent=`${teams[active].name} chose ${'ABCD'[i]}. Confirm the final answer.`;tone(440,.075);setButtonState()}
function lock(){if(selected<0||locked||revealed)return;locked=true;stopClock();el('message').textContent=`Final answer: ${'ABCD'[selected]} — ready to reveal?`;tone(280,.30);setButtonState()}
function reveal(){if(!locked||revealed)return;revealed=true;const q=question();const yes=selected===q.a;el('options').querySelectorAll('.option').forEach((b,i)=>{if(i===q.a)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});if(yes){teams[active].points+=prizes[index];playSuccess()}else tone(160,.47,.09);el('message').textContent=`${yes?'CORRECT! +'+format(prizes[index])+' points.':'NOT THIS TIME.'} ${q.e}`;renderTeams();setButtonState()}
function next(){if(!revealed)return;index++;active=(active+1)%teams.length;render()}
function setButtonState(){el('lock').disabled=selected<0||locked||revealed;el('reveal').disabled=!locked||revealed;el('next').disabled=!revealed;el('options').querySelectorAll('button').forEach(b=>b.disabled=locked||revealed)}
function updateLifelines(){['fifty','poll','phone'].forEach(k=>{el(k).classList.toggle('used',used[k]);el(k).disabled=used[k]||revealed||locked||!started})}
function fifty(){if(used.fifty||locked||revealed)return;used.fifty=true;const w=[0,1,2,3].filter(i=>i!==question().a);w.sort(()=>Math.random()-.5);hidden=w.slice(0,2);hidden.forEach(i=>el('options').querySelector(`[data-i="${i}"]`).classList.add('hidden'));el('message').textContent='50:50 — Two incorrect options removed.';updateLifelines();tone(540,.22)}
function helperBox(title,content){el('overlay').classList.remove('hidden');el('modal').innerHTML=`<h1>${title}</h1>${content}<p><button id="resume">BACK TO GAME</button></p>`;el('resume').onclick=()=>el('overlay').classList.add('hidden')}
function audience(){if(used.poll||locked||revealed)return;used.poll=true;updateLifelines();const correct=question().a;let nums=[12,14,16,13];nums[correct]=57;const sum=nums.reduce((a,b)=>a+b,0);nums=nums.map(n=>Math.round(n*100/sum));nums[correct]+=100-nums.reduce((a,b)=>a+b,0);let html='<p>SIMULATED POLL — NOT REAL STUDENT VOTES</p><div id="pollChart">';nums.forEach((n,i)=>html+=`<span>${'ABCD'[i]}</span><div class="bar"><div class="fill" style="width:${n}%"></div></div><span>${n}%</span>`);html+='</div>';helperBox('ASK THE AUDIENCE',html);tone(600,.22)}
function phone(){if(used.phone||locked||revealed)return;used.phone=true;updateLifelines();const q=question();helperBox('PHONE A FRIEND',`<p>SIMULATED HINT — NOT A REAL PHONE CALL</p><p>“I’m leaning toward <strong>${'ABCD'[q.a]}</strong>.<br>The key is: <em>${escapeHTML(q.e)}</em>”</p>`);tone(700,.2)}
function finish(){stopClock();el('overlay').classList.remove('hidden');const sorted=[...teams].sort((a,b)=>b.points-a.points);el('modal').innerHTML=`<h1>THE FINAL RESULT</h1><p>★ ${sorted[0].name} LEADS THE SHOW ★</p>${sorted.map((t,i)=>`<p>${i+1}. ${t.name} — <b>${format(t.points)} points</b></p>`).join('')}<p><button id="again">PLAY AGAIN ▶</button></p><small>All scores are classroom points, not real money.</small>`;el('again').onclick=setup;started=false}
function fullscreen(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}catch(_){}}
el('startGame')?.addEventListener('click',()=>{});
el('fifty').onclick=fifty;el('poll').onclick=audience;el('phone').onclick=phone;el('lock').onclick=lock;el('reveal').onclick=reveal;el('next').onclick=next;el('fullBtn').onclick=fullscreen;el('soundBtn').onclick=()=>{sound=!sound;el('soundBtn').textContent='♪ SOUND: '+(sound?'ON':'OFF')};el('restartBtn').onclick=()=>{if(confirm('Start a new game and reset all points?'))setup()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k==='f'){fullscreen();return}if(k==='m'){el('soundBtn').click();return}if(!started||!el('overlay').classList.contains('hidden'))return;if('1234'.includes(k))choose(Number(k)-1);else if(k==='enter'){if(!locked)lock();else if(!revealed)reveal();else next()}else if(k==='n')next();else if(k==='5')fifty();else if(k==='h')phone()});
setup();
