<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#15182a">
  <meta name="google" content="notranslate">
  <title>Wordy Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="wordyApp" class="wordy-app">
    <header class="wordy-topbar" aria-label="Level status">
      <div class="status-block status-level">
        <span class="status-label">LEVEL</span>
        <strong id="levelLabel">A · First Move</strong>
      </div>
      <div class="status-block">
        <span class="status-label">SCORE</span>
        <strong id="scoreValue">0</strong>
      </div>
      <div class="status-block">
        <span class="status-label">MOVES</span>
        <strong id="movesValue">10</strong>
      </div>
    </header>

    <section class="wordy-instruction" aria-live="polite">
      <p id="objectiveText">Swap neighboring words to build a valid English relationship.</p>
      <div id="eventLabel" class="event-label" aria-live="polite"></div>
    </section>

    <section class="board-stage" aria-label="Word puzzle board">
      <div id="wordyBoard" class="wordy-board" role="grid" aria-label="Wordy game board"></div>
    </section>

    <section class="wordy-controls" aria-label="Board controls">
      <span id="readyCount" class="ready-count">0 ready</span>
      <button id="popButton" class="pop-button" type="button" disabled>POP</button>
    </section>
  </main>

  <section id="resultOverlay" class="result-overlay" aria-hidden="true" hidden>
    <div class="result-sheet" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="result-heading">
        <span class="result-kicker">ROUND REVIEW</span>
        <h1 id="resultTitle">What you discovered</h1>
      </div>

      <section class="review-section">
        <h2>New learning</h2>
        <div id="newLearningList" class="review-list"></div>
      </section>

      <section class="review-section">
        <h2>You could have scored more</h2>
        <div id="missedList" class="review-list"></div>
      </section>

      <div id="replayBoard" class="replay-board" aria-live="polite"></div>

      <div class="result-actions">
        <button id="replayButton" type="button" class="secondary-button">Replay</button>
        <button id="nextButton" type="button" class="primary-button">Next</button>
      </div>
    </div>
  </section>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
