<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Verb Runner — Character Lab</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce9ef;font-family:Inter,system-ui,sans-serif}
    #stage{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none}
    .panel{background:rgba(13,24,34,.84);color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.18);backdrop-filter:blur(10px)}
    .title{position:absolute;left:20px;top:18px;padding:12px 15px;border-radius:16px;min-width:220px}
    .title small{display:block;font-size:10px;font-weight:900;letter-spacing:.15em;color:#78dcff}
    .title strong{display:block;margin-top:3px;font-size:22px}
    .title span{display:block;margin-top:4px;font-size:11px;color:#cfe5ef;font-weight:700}
    .view-panel{position:absolute;right:18px;top:18px;padding:10px;border-radius:16px;display:flex;gap:7px;pointer-events:auto}
    button{font:inherit}
    .view-panel button,.pause-btn,.character-card{border:0;cursor:pointer}
    .view-panel button,.pause-btn{padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.92);color:#26323c;font-size:11px;font-weight:900}
    .view-panel button:hover,.pause-btn:hover{background:#fff}
    .selector{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));padding:10px;border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;pointer-events:auto}
    .character-card{min-height:62px;padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.10);color:#fff;text-align:left;border:1px solid rgba(255,255,255,.12)}
    .character-card strong{display:block;font-size:12px}
    .character-card span{display:block;margin-top:3px;font-size:9px;line-height:1.2;color:#bcd2dc;font-weight:700}
    .character-card.active{background:#fff;color:#17242d;border-color:#fff}
    .character-card.active span{color:#526773}
    .help{position:absolute;left:20px;bottom:104px;padding:9px 12px;border-radius:13px;font-size:10px;font-weight:850;letter-spacing:.05em}
    .pause-wrap{position:absolute;right:18px;bottom:104px;pointer-events:auto}
    .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:14px;font-size:12px;font-weight:900;display:none}
    body[data-character-ready="loading"] .loading{display:block}
    @media(max-width:760px){
      .title{left:10px;top:10px;padding:9px 12px;min-width:0}
      .title strong{font-size:17px}
      .title span{display:none}
      .view-panel{right:10px;top:10px;padding:6px;gap:4px}
      .view-panel button{padding:8px 7px;font-size:9px}
      .selector{bottom:8px;width:calc(100% - 12px);grid-template-columns:repeat(5,minmax(92px,1fr));overflow-x:auto}
      .character-card{min-width:92px}
      .help{left:10px;bottom:92px;font-size:9px}
      .pause-wrap{right:10px;bottom:92px}
    }
  </style>
  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-character-ready="loading">
  <div id="stage"></div>

  <div class="hud">
    <div class="title panel">
      <small>VERB RUNNER · CHARACTER LAB</small>
      <strong id="characterTitle">Street Runner</strong>
      <span id="characterSubtitle">Sporty · contemporary · backpack</span>
    </div>

    <div class="view-panel panel" aria-label="Camera views">
      <button type="button" data-view="front">FRONT</button>
      <button type="button" data-view="three">3/4</button>
      <button type="button" data-view="back">BACK</button>
    </div>

    <div class="help panel">DRAG / SWIPE TO ROTATE · WHEEL / PINCH TO ZOOM</div>

    <div class="pause-wrap">
      <button id="motionToggle" class="pause-btn" type="button">PAUSE RUN</button>
    </div>

    <div class="selector panel" aria-label="Runner options">
      <button class="character-card active" type="button" data-character="street">
        <strong>Street Runner</strong><span>sporty · current base</span>
      </button>
      <button class="character-card" type="button" data-character="young">
        <strong>Young Runner</strong><span>younger · lighter silhouette</span>
      </button>
      <button class="character-card" type="button" data-character="adventure">
        <strong>Adventure</strong><span>more hair · stronger identity</span>
      </button>
      <button class="character-card" type="button" data-character="utility">
        <strong>Utility</strong><span>robust · practical outfit</span>
      </button>
      <button class="character-card" type="button" data-character="sportF">
        <strong>Sport F</strong><span>female sporty option</span>
      </button>
    </div>

    <div class="loading panel">LOADING CHARACTER…</div>
  </div>

  <script type="module" src="./character-lab.js?v=20260921-4"></script>
</body>
</html>
