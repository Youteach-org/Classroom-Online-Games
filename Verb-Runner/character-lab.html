<!doctype html>
<html lang="en">
<head>

    .badge{position:absolute;right:24px;top:22px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.9);color:#23313c;font-size:12px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.14)}

  }

</head>
<body>
  <div id="stage"></div>
  <div class="hud">
