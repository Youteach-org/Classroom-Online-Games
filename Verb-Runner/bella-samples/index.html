<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pronunciation Decision Console</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f4f6f8;color:#18202b;margin:0;padding:14px}
    main{max-width:1080px;margin:auto}
    h1{margin:0 0 3px;font-size:25px}
    .sub{margin:0 0 12px;color:#5c6775;font-size:13px}
    .badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e7ecf2;font-size:11px;font-weight:800}
    .toolbar{display:flex;align-items:end;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid #dfe5ec;border-radius:11px;padding:10px;margin-bottom:10px}
    .toolbar label{display:grid;gap:3px;font-size:10px;font-weight:800;color:#5d6876}
    select,textarea{font:inherit;border:1px solid #cbd3dc;border-radius:7px;background:#fff}
    select{padding:7px 28px 7px 8px}
    .filters{display:flex;gap:4px;flex-wrap:wrap}
    .filters button,.candidate button,.none-button{font:inherit;border:1px solid #cbd3dc;background:#fff;border-radius:7px;padding:7px 10px;font-weight:800;cursor:pointer}
    .filters button[data-active="true"]{background:#202a36;color:#fff;border-color:#202a36}
    .summary{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
    .summary span{font-size:11px;font-weight:800;background:#eef2f6;border-radius:999px;padding:5px 8px}
    .batch-description{font-size:12px;color:#65707d;margin:0 2px 10px}
    .items{display:grid;gap:9px}
    .item{background:#fff;border:1px solid #dfe5ec;border-radius:11px;padding:10px}
    .item.decided{border-left:4px solid #63956f}
    .item.none-selected{border-left:4px solid #b86d65}
    .item-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
    .word{font-size:20px;font-weight:900;line-height:1.1;flex:1 1 180px}
    .status{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f6}
    .candidates{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}
    .candidate{border:1px solid #e0e5eb;border-radius:9px;padding:7px;min-width:0}
    .candidate[data-selected="true"]{border:2px solid #4d7858;background:#f0f8f2}
    .candidate-title{font-size:11px;font-weight:900;color:#56616e;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    audio{display:block;width:100%;height:32px;margin-bottom:5px}
    .candidate button{width:100%;padding:6px 8px}
    .candidate[data-selected="true"] button{background:#dceddf;border-color:#87a890}
    .decision-row{display:grid;grid-template-columns:auto minmax(160px,1fr) auto;gap:7px;align-items:start;margin-top:8px}
    .none-button[data-selected="true"]{background:#ffe5e2;border-color:#c98881}
    textarea{width:100%;min-height:39px;padding:7px;resize:vertical}
    .save-state{font-size:10px;color:#6d7784;padding-top:8px;min-width:44px}
    .hidden{display:none!important}
    @media(max-width:680px){
      body{padding:8px}
      h1{font-size:22px}
      .toolbar{align-items:stretch}
      .toolbar>label{width:100%}
      .toolbar select{width:100%}
      .summary{margin-left:0;width:100%}
      .candidates{grid-template-columns:1fr}
      .decision-row{grid-template-columns:auto 1fr}
      .save-state{grid-column:1/-1;padding-top:0}
    }
  </style>
</head>
<body>
<main>
  <h1>Pronunciation Decision Console</h1>
  <p class="sub"><span class="badge">Kokoro · af_bella</span> One permanent console for every pronunciation decision batch.</p>

  <div class="toolbar">
    <label>
      Batch
      <select id="batchSelect"></select>
    </label>
    <div class="filters" aria-label="Filters">
      <button type="button" data-filter="all" data-active="true">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="decided">Decided</button>
    </div>
    <div class="summary">
      <span id="countAll">Total: 0</span>
      <span id="countPending">Pending: 0</span>
      <span id="countDecided">Decided: 0</span>
    </div>
  </div>

  <p class="batch-description" id="batchDescription"></p>
  <section class="items" id="items"></section>
</main>

<script src="../../Support-Meter/config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,update} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const cfg=window.SUPPORT_METER_CONFIG;
if(!cfg?.firebase)throw new Error('Firebase configuration is unavailable.');

const app=initializeApp(cfg.firebase);
const db=getDatabase(app);
const batchSelect=document.querySelector('#batchSelect');
const itemsNode=document.querySelector('#items');
const descriptionNode=document.querySelector('#batchDescription');
const countAll=document.querySelector('#countAll');
const countPending=document.querySelector('#countPending');
const countDecided=document.querySelector('#countDecided');
const filterButtons=[...document.querySelectorAll('[data-filter]')];

let config=null;
let batchId=null;
let batch=null;
let manifest=null;
let reviews={};
let filter='all';
let unsubscribe=null;
const noteTimers=new Map();

const esc=value=>String(value??'')
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'","&#39;");

function reviewRoot(){
  return `${config.firebaseRoot}/batches/${batchId}/items`;
}

function selectedFor(slug){
  return reviews?.[slug]?.selectedCandidate||'';
}

function isDecided(slug){
  return Boolean(selectedFor(slug));
}

function updateSummary(){
  const slugs=Object.keys(manifest?.items||{});
  const decided=slugs.filter(isDecided).length;
  countAll.textContent=`Total: ${slugs.length}`;
  countPending.textContent=`Pending: ${slugs.length-decided}`;
  countDecided.textContent=`Decided: ${decided}`;
}

function matches(slug){
  if(filter==='pending')return !isDecided(slug);
  if(filter==='decided')return isDecided(slug);
  return true;
}

function applyItemState(slug){
  const card=itemsNode.querySelector(`.item[data-slug="${CSS.escape(slug)}"]`);
  if(!card)return;
  const selected=selectedFor(slug);
  card.classList.toggle('decided',Boolean(selected));
  card.classList.toggle('none-selected',selected==='none');
  card.querySelector('.status').textContent=selected
    ? (selected==='none'?'NONE':'DECIDED')
    : 'PENDING';
  for(const node of card.querySelectorAll('.candidate')){
    node.dataset.selected=String(node.dataset.candidate===selected);
  }
  const none=card.querySelector('.none-button');
  none.dataset.selected=String(selected==='none');
  const note=card.querySelector('textarea');
  if(document.activeElement!==note)note.value=reviews?.[slug]?.note||'';
  card.classList.toggle('hidden',!matches(slug));
}

function render(){
  itemsNode.replaceChildren();
  const variants=manifest?.variants||{};
  for(const [slug,item] of Object.entries(manifest?.items||{})){
    const card=document.createElement('article');
    card.className='item';
    card.dataset.slug=slug;

    const candidateHtml=Object.entries(item.files||{}).map(([candidate,src])=>{
      const label=variants[candidate]?.label||candidate;
      return `
        <div class="candidate" data-candidate="${esc(candidate)}">
          <div class="candidate-title" title="${esc(label)}">${esc(label)}</div>
          <audio controls preload="none" src="${esc(src)}"></audio>
          <button type="button" data-select-candidate="${esc(candidate)}">Choose</button>
        </div>
      `;
    }).join('');

    card.innerHTML=`
      <div class="item-head">
        <div class="word">${esc(item.label||slug)}</div>
        <span class="status">PENDING</span>
      </div>
      <div class="candidates">${candidateHtml}</div>
      <div class="decision-row">
        <button class="none-button" type="button" data-select-candidate="none">None</button>
        <textarea placeholder="Optional note: what sounds wrong or why you chose it?"></textarea>
        <div class="save-state"></div>
      </div>
    `;
    itemsNode.appendChild(card);
    applyItemState(slug);
  }
  updateSummary();
}

async function save(slug,patch){
  const card=itemsNode.querySelector(`.item[data-slug="${CSS.escape(slug)}"]`);
  const state=card?.querySelector('.save-state');
  if(state)state.textContent='Saving…';
  try{
    await update(ref(db,`${reviewRoot()}/${slug}`),{
      ...patch,
      batchId,
      voice:config.voice,
      updatedAt:Date.now()
    });
    if(state)state.textContent='Saved';
  }catch(error){
    console.error(error);
    if(state)state.textContent='Failed';
  }
}

function scheduleNoteSave(slug,note){
  clearTimeout(noteTimers.get(slug));
  noteTimers.set(slug,setTimeout(()=>save(slug,{note:note.trim()}),450));
}

itemsNode.addEventListener('click',event=>{
  const button=event.target.closest('[data-select-candidate]');
  if(!button)return;
  const card=button.closest('.item[data-slug]');
  const slug=card.dataset.slug;
  const selectedCandidate=button.dataset.selectCandidate;
  reviews[slug]={...(reviews[slug]||{}),selectedCandidate};
  applyItemState(slug);
  updateSummary();
  save(slug,{selectedCandidate});
});

itemsNode.addEventListener('input',event=>{
  const note=event.target.closest('textarea');
  if(!note)return;
  const card=note.closest('.item[data-slug]');
  scheduleNoteSave(card.dataset.slug,note.value);
});

for(const button of filterButtons){
  button.addEventListener('click',()=>{
    filter=button.dataset.filter;
    for(const other of filterButtons){
      other.dataset.active=String(other===button);
    }
    for(const slug of Object.keys(manifest?.items||{}))applyItemState(slug);
  });
}

async function loadBatch(nextBatchId){
  if(unsubscribe){
    unsubscribe();
    unsubscribe=null;
  }
  batchId=nextBatchId;
  batch=config.batches[batchId];
  if(!batch)throw new Error(`Unknown batch: ${batchId}`);
  descriptionNode.textContent=batch.description||'';
  manifest=await fetch(batch.manifest,{cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error(`Could not load ${batch.manifest}`);
    return r.json();
  });
  reviews={};
  render();

  const url=new URL(location.href);
  url.searchParams.set('batch',batchId);
  history.replaceState(null,'',url);

  unsubscribe=onValue(ref(db,reviewRoot()),snapshot=>{
    reviews=snapshot.exists()?snapshot.val()||{}:{};
    for(const slug of Object.keys(manifest.items||{}))applyItemState(slug);
    updateSummary();
  },error=>console.error('Decision sync error',error));
}

config=await fetch('./decision-batches.json',{cache:'no-store'}).then(r=>r.json());
for(const [id,entry] of Object.entries(config.batches)){
  const option=document.createElement('option');
  option.value=id;
  option.textContent=entry.label;
  batchSelect.appendChild(option);
}
const requested=new URL(location.href).searchParams.get('batch');
const initial=config.batches[requested]?requested:config.currentBatch;
batchSelect.value=initial;
batchSelect.addEventListener('change',()=>loadBatch(batchSelect.value));
await loadBatch(initial);
</script>
</body>
</html>
