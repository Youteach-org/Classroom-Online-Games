<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Verb Runner Pronunciation Review</title>
  <link rel="stylesheet" href="./review.css?v=13">
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <h1>Verb Runner · Pronunciation Review</h1>
      <a class="back" href="/teacher/">Teacher tools</a>
    </div>
    <div class="toolbar">
      <label class="reviewer-field">
        <span>Reviewed by</span>
        <input id="reviewerName" maxlength="60" placeholder="Your name" autocomplete="name">
      </label>
      <div class="search-field">
        <input id="searchInput" class="search" placeholder="No. or word" autocomplete="off" aria-label="Search audio">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
      </div>
      <select id="statusFilter" aria-label="Filter">
        <option value="all">All</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="reported">Reported</option>
        <option value="review-again">Review Again</option>
        <option value="reviewed">Reviewed</option>
        <option value="duplicate">Duplicates</option>
        <option value="removed-duplicate">Removed duplicates</option>
      </select>
      <button id="repairReported" class="repair-reported-button" type="button">Repair reported</button>
      <button id="exportJson" type="button">Export JSON</button>
      <button id="exportMarkdown" type="button">Export log</button>
    </div>
    <div class="summary">
      <span id="totalCount">Loading…</span>
      <span id="reviewedCount"></span>
      <span id="problemCount"></span>
      <span id="duplicateCount"></span>
      <span id="syncState">Firebase: connecting…</span>
    </div>
  </header>

  <main>
    <section class="info">
      Reports save immediately to Firebase. Duplicate cleanup is synchronized to GitHub automatically.
      Deleting a repeated report is soft-delete so its audit trail remains recoverable.
    </section>

    <section id="audioList" class="audio-list" aria-live="polite"></section>
  </main>

  <template id="audioCardTemplate">
    <article class="audio-card">
      <div class="card-head">
        <div class="number"></div>
        <div class="identity">
          <div class="key-line">
            <strong class="audio-key"></strong>
            <button class="status-badge" type="button" data-action="toggle-history"></button>
            <span class="changed-badge" hidden>AUDIO CHANGED · REVIEW AGAIN</span>
          </div>
        </div>
      </div>

      <div class="listen-row">
        <audio controls preload="none"></audio>
        <button class="ok-button" type="button" data-action="reviewed">OK</button>
        <button class="report-button" type="button" data-action="toggle-report">Report</button>
        <button class="duplicate-button" type="button" data-action="toggle-duplicate">Duplicated</button>
      </div>
      <div class="detail-row">
        <span class="metadata"></span>
        <span class="source"></span>
      </div>

      <section class="report-panel panel" hidden>
        <textarea class="report-text" rows="3" placeholder="Describe exactly what is wrong with this audio"></textarea>
        <div class="panel-actions">
          <select class="report-kind">
            <option value="pronunciation">Pronunciation</option>
            <option value="file-error">File / playback error</option>
            <option value="timing">Timing / cut / vibrato</option>
            <option value="other">Other</option>
          </select>
          <span class="autosave-status" aria-live="polite"></span>
        </div>
      </section>

      <section class="duplicate-panel panel" hidden>
        <div class="duplicate-reference-row">
          <label>
            Original audio #
            <input class="duplicate-target-ref" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 127">
          </label>
          <span class="duplicate-match">Enter the original audio number.</span>
        </div>
        <div class="panel-actions">
          <button type="button" data-action="mark-duplicate">Remove duplicate</button>
        </div>
      </section>

      <section class="review-history-panel panel" hidden>
        <div class="history-group">
          <div class="history-title">Previous reports <span class="report-count"></span></div>
          <div class="reports-list"></div>
        </div>
        <div class="history-group">
          <div class="history-title">Review history <span class="history-count"></span></div>
          <div class="history-list"></div>
        </div>
      </section>
    </article>
  </template>

  <script src="../../Support-Meter/config.js"></script>
  <script src="../pronunciation-manifest.js?v=review-console-20260919-4"></script>
  <script src="./review-core.js?v=5"></script>
  <script type="module" src="./review-app.js?v=15"></script>
</body>
</html>
