<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Support Meter — Connectivity 5</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="version-tag" aria-label="Version 17">v17</div>
<div id="startScreen" class="start-screen">
  <div class="start-card">
    <div class="start-logo"><span class="speech-logo" aria-hidden="true"><svg viewBox="0 0 64 56" role="img" focusable="false"><path d="M8 5h48a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H31L20 53l2-8H8a6 6 0 0 1-6-6V11a6 6 0 0 1 6-6Z" fill="#f5f4ff" stroke="#76cfff" stroke-width="3"/><circle cx="22" cy="25" r="4" fill="#7158d9"/><circle cx="32" cy="25" r="4" fill="#7158d9"/><circle cx="42" cy="25" r="4" fill="#7158d9"/></svg></span><strong>SUPPORT <em>METER</em></strong></div>
    <div class="start-sub">Connectivity 5 · Unit 3 Vocabulary</div>
    <label>Your name<input id="studentName" autocomplete="name" placeholder="Type your name"></label>
    <label>Class code<input id="classCode" maxlength="40" value="CONNECT5"></label>
    <button id="startBtn" type="button">START GAME</button>
    <div id="startError" class="start-error hidden"></div>
  </div>
</div>

<main id="game" class="game hidden">
  <section class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="speech-logo" aria-hidden="true"><svg viewBox="0 0 64 56" role="img" focusable="false"><path d="M8 5h48a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H31L20 53l2-8H8a6 6 0 0 1-6-6V11a6 6 0 0 1 6-6Z" fill="#f5f4ff" stroke="#76cfff" stroke-width="3"/><circle cx="22" cy="25" r="4" fill="#7158d9"/><circle cx="32" cy="25" r="4" fill="#7158d9"/><circle cx="42" cy="25" r="4" fill="#7158d9"/></svg></span>
        <div><div class="brand-title">SUPPORT <span>METER</span></div><div class="brand-sub">Read the story, choose the feeling and the expression.</div></div>
      </div>
      <div class="hud-meter">
        <div class="hud-label">Support Meter</div>
        <div class="meter-row"><div class="meter-track"><div id="meterFill" class="meter-fill"></div></div><div id="meterValue" class="meter-value">55%</div><span class="meter-star" aria-hidden="true">★</span></div>
      </div>
      <div class="hud-stat"><span>Score</span><strong id="scoreValue">0</strong></div>
      <div class="hud-stat"><span>Streak</span><strong><i>🔥</i> <b id="streakValue">0</b></strong></div>
      <div class="hud-stat"><span>Story</span><strong id="storyValue">1 / 8</strong></div>
    </header>

    <div class="main-grid">
      <section class="story-panel">
        <div class="story-heading"><div class="story-tab">Mini Story</div><div class="watch-text">Watch what happens...</div></div>
        <div id="storyFrames" class="story-frames"></div>
      </section>

      <aside class="choice-panel">
        <div class="choice-tools">
          <button id="coachToggle" class="coach-toggle" type="button" aria-pressed="true"><span class="coach-label">Coach</span><span class="coach-switch"><b id="coachToggleState">ON</b><i class="coach-knob" aria-hidden="true"></i></span></button>
        </div>
        <div class="choice-title" id="feelingTitle">What is the feeling?</div>
        <div id="feelings" class="feelings">
          <button type="button" data-feeling="Frustration"><span class="feel-emoji">😠</span><span>Frustration</span></button>
          <button type="button" data-feeling="Empathy"><span class="feel-emoji">😟</span><span>Empathy</span></button>
          <button type="button" data-feeling="Encouragement"><span class="feel-emoji enc-pair" aria-label="smiling face with thumbs up"><span class="enc-face">😆</span><span class="enc-thumb">👍</span></span><span>Encouragement</span></button>
        </div>
        <div class="choice-title expression-title" id="expressionTitle">What would the character say?</div>
        <div id="expressions" class="expressions"></div>
      </aside>
    </div>

    <div class="bottombar">
      <button id="submitBtn" class="submit-btn" type="button">Submit Answer <span>❯</span></button>
      <button id="nextBtn" class="next-btn hidden" type="button">Next Story <span>❯</span></button>
    </div>
<div id="feedback" class="feedback hidden" aria-live="polite">
      <img id="coachImage" alt="Support Meter coach">
      <div class="feedback-bubble">
        <button id="feedbackClose" class="feedback-close" type="button" aria-label="Close feedback">×</button>
        <div id="feedbackTitle" class="feedback-title">Not quite!</div>
        <div id="feedbackText" class="feedback-text"></div>
      </div>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="language.js"></script>
<script src="game.js"></script>
</body>
</html>
