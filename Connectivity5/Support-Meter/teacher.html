<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Meter — Teacher Monitor</title><link rel="canonical" href="./teacher/"><link rel="stylesheet" href="teacher.css"><link rel="stylesheet" href="teacher-v29.css"></head><body>
<div class="version-tag" aria-label="Version 30">v30</div>
<div class="monitor-sticky-header"><header class="teacher-header"><div><a class="teacher-menu-link" href="/teacher/">← Back to Teacher Menu</a><h1>SUPPORT <span>METER</span> · Teacher Monitor</h1><p>Live activity · click or touch a student to focus</p></div><div class="status"><span class="dot" id="monitorDot"></span><strong id="monitorStatus">Ready</strong></div></header><section class="session-list-wrap" aria-labelledby="sessionsTitle"><h2 id="sessionsTitle">Sessions</h2><div id="sessionList" class="session-list"></div></section></div>
<section class="assignment-panel" aria-label="Assignment controls"><label>Set<select id="setNumber"><option value="1">Set 1</option><option value="2">Set 2</option><option value="3">Set 3</option></select></label><button id="createSession" class="primary" type="button">Create Session</button><div id="shareBox" class="share-box hidden"><input id="studentLink" readonly aria-label="Student link"><button id="copyLink" type="button">Copy Student Link</button></div><button id="downloadResults" type="button" disabled>Download Results</button><section class="statusbar"><strong id="onlineCount">0 online</strong><span id="totalCount">0 students</span><button id="hideOffline" type="button">Hide offline</button></section><div id="assignmentError" class="error hidden" role="alert"></div></section>
<main><div id="studentGrid" class="grid"></div><div id="focusStage" class="focus-stage hidden"><div id="focusedStudent"></div><aside id="thumbnailRail" class="thumbnail-rail" aria-label="Other students"></aside></div><div id="emptyMonitor" class="empty">Create or select a session to begin.</div></main>
<script src="config.js"></script><script src="teacher-core.js"></script><script src="firebase-core.js"></script><script type="module" src="teacher.js"></script></body></html>
