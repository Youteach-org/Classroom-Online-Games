<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Meter — Teacher Monitor</title><link rel="stylesheet" href="teacher.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="version-tag" aria-label="Version 16">v16</div>
<header><div><h1>SUPPORT <span>METER</span> · Teacher Monitor</h1><p>Live student activity · submitted responses only in history</p></div><div class="connect"><input id="monitorClassCode" value="CONNECT5"><button id="connectMonitor">CONNECT</button></div></header>
<section class="statusbar"><span class="dot" id="monitorDot"></span><strong id="monitorStatus">Connecting…</strong><span id="onlineCount">0 online</span><span id="totalCount">0 students</span><button id="hideOffline">Hide offline</button></section>
<main><div id="studentGrid" class="grid"></div><div id="emptyMonitor" class="empty">No students yet.</div></main>
<script src="config.js"></script><script src="teacher.js"></script></body></html>
