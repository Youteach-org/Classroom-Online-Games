<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Students Said — Teacher Monitor</title><link rel="stylesheet" href="monitor-approved.css"></head><body class="monitor"><header><a href="/teacher/" style="color:white">← COG Teacher Menu</a><strong>100 STUDENTS SAID · MONITOR</strong><span id="connection">Connecting…</span><button id="openBoard">Open Public Board</button></header><main class="monitor-grid"><section class="stack left"><article class="panel flow-panel"><h2>Game Flow</h2><select id="phase"><option value="faceoff">Face-off</option><option value="control">Team Control</option><option value="steal">Steal</option></select><button class="action secondary" id="nextQuestion">Next Question</button></article><article class="panel question-panel"><h2>Question Bank</h2><div id="questionList"></div><button class="action secondary" id="reveal">Reveal Answer</button><button class="action secondary" id="uploadBtn">Load CSV</button><input class="upload" id="csv" type="file" accept=".csv,text/csv"></article><article class="panel guide-panel"><h2>Teacher Guide</h2><div id="guide" class="compact-guide">Prompt · Model answer · Alternatives</div></article></section><section class="stack center"><article class="panel preview-panel"><h2>Public Board Preview</h2><div class="preview"><iframe src="board.html" title="Public board preview"></iframe></div></article><section class="bottom-controls"><article class="panel metric"><span>ANSWER TIME</span><strong id="time">10s</strong><button data-time="-1">−</button><button id="startTimer">Start</button><button data-time="1">+</button></article><article class="panel metric"><span>ROUND BANK</span><strong id="roundBank">0</strong><button data-bank="-10">−10</button><button data-bank="10">+10</button></article><article class="panel metric"><span>TEAM 1</span><strong id="score1">0</strong><button data-award="Team 1">Award bank</button></article><article
