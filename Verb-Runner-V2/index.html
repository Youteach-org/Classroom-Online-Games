<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Verb Runner V2 · Robot Runners</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">VERB RUNNER V2</span>
      <h1>Robot runners</h1>
      <p>One rig. One model. Six color variants.</p>
    </div>
    <div class="test-panel" aria-label="Robot animation test">
      <span>Animation test</span>
      <div class="animation-buttons">
        <button type="button" data-animation="idle">Idle</button>
        <button type="button" data-animation="run" class="active">Run</button>
        <button type="button" data-animation="jump">Jump</button>
      </div>
    </div>
  </header>

  <main class="gallery" id="gallery">
    <article class="runner-card" style="--accent:#e43c3c" data-runner="0">
      <div class="card-heading"><span class="color-dot"></span><strong>RED</strong></div>
      <canvas id="model-0" aria-label="Red robot runner"></canvas>
      <div class="card-status" id="status-0">Loading robot…</div>
    </article>

    <article class="runner-card" style="--accent:#2475d1" data-runner="1">
      <div class="card-heading"><span class="color-dot"></span><strong>BLUE</strong></div>
      <canvas id="model-1" aria-label="Blue robot runner"></canvas>
      <div class="card-status" id="status-1">Loading robot…</div>
    </article>

    <article class="runner-card" style="--accent:#29a65a" data-runner="2">
      <div class="card-heading"><span class="color-dot"></span><strong>GREEN</strong></div>
      <canvas id="model-2" aria-label="Green robot runner"></canvas>
      <div class="card-status" id="status-2">Loading robot…</div>
    </article>

    <article class="runner-card" style="--accent:#ef4c78" data-runner="3">
      <div class="card-heading"><span class="color-dot"></span><strong>PINK</strong></div>
      <canvas id="model-3" aria-label="Pink robot runner"></canvas>
      <div class="card-status" id="status-3">Loading robot…</div>
    </article>

    <article class="runner-card" style="--accent:#eef1f7" data-runner="4">
      <div class="card-heading"><span class="color-dot"></span><strong>WHITE / BLACK</strong></div>
      <canvas id="model-4" aria-label="White and black robot runner"></canvas>
      <div class="card-status" id="status-4">Loading robot…</div>
    </article>

    <article class="runner-card" style="--accent:#9a4de0" data-runner="5">
      <div class="card-heading"><span class="color-dot"></span><strong>PURPLE</strong></div>
      <canvas id="model-5" aria-label="Purple robot runner"></canvas>
      <div class="card-status" id="status-5">Loading robot…</div>
    </article>
  </main>

  <footer class="note">Same RobotExpressive rig and geometry for all six runners · color changes only.</footer>
  <script type="module" src="./prototype.js"></script>
</body>
</html>
