<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Verb Runner V2</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Verb Runner V2 3D game"></canvas>

    <section class="hud">
      <div class="brand">
        <span class="eyebrow">VERB RUNNER</span>
        <strong>3D PROTOTYPE</strong>
      </div>

      <div class="hud-right">
        <button id="runnerChip" class="runner-chip" type="button" aria-label="Change robot">
          <span id="runnerDot" class="runner-dot"></span>
          <span id="runnerName">RED</span>
        </button>

        <div class="stats">
          <div><span>Distance</span><b id="distance">0000</b></div>
          <div><span>Speed</span><b id="speed">1.00×</b></div>
        </div>
      </div>
    </section>

    <section class="status">
      <div id="modelStatus" class="pill">Loading robot…</div>
      <div class="controls">
        <span>← → lanes</span>
        <span>↑ / SPACE jump</span>
        <span>↓ slide</span>
        <span>Swipe on mobile</span>
      </div>
    </section>

    <section id="picker" class="picker" aria-label="Choose robot">
      <div class="picker-card">
        <span class="picker-kicker">CHOOSE YOUR RUNNER</span>
        <h1>Pick a robot</h1>
        <p>Same robot and animations. Only the color changes.</p>

        <div class="robot-options">
          <button class="robot-option active" type="button" data-runner="0" style="--runner:#e43c3c"><span></span><b>RED</b></button>
          <button class="robot-option" type="button" data-runner="1" style="--runner:#2475d1"><span></span><b>BLUE</b></button>
          <button class="robot-option" type="button" data-runner="2" style="--runner:#29a65a"><span></span><b>GREEN</b></button>
          <button class="robot-option" type="button" data-runner="3" style="--runner:#ef4c78"><span></span><b>PINK</b></button>
          <button class="robot-option" type="button" data-runner="4" style="--runner:#eef1f7"><span></span><b>WHITE / BLACK</b></button>
          <button class="robot-option" type="button" data-runner="5" style="--runner:#9a4de0"><span></span><b>PURPLE</b></button>
        </div>

        <button id="startButton" class="start-button" type="button" disabled>START RUN</button>
      </div>
    </section>

    <div id="flash" class="flash" aria-hidden="true"></div>
  </main>

  <script type="module" src="./prototype.js"></script>
</body>
</html>
