<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Talk Talk — Teacher</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="reference-page teacher-reference-page" data-reference-source="a_clean_ui_ux_product_mockup_collage_with_multiple.png">
  <main class="reference-shell teacher-reference-shell" aria-label="Talk Talk teacher preview">
    <section id="teacherMonitorView" class="teacher-view reference-screen is-active teacher-monitor-reference" data-approved-screen="5" data-crop="12,607,514,1008">
      <svg class="reference-art" viewBox="12 607 502 401" role="img" aria-label="Teacher Monitor"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button class="screen-hotspot teacher-team-one" data-target="teacherTeamView" aria-label="Open Team 1"></button>
      <button id="sendTwistBtn" class="screen-hotspot teacher-send-twist" aria-label="Send Twist"></button>
      <button id="endActivityBtn" class="screen-hotspot teacher-end" aria-label="End Activity"></button>
    </section>

    <section id="teacherTeamView" class="teacher-view reference-screen teacher-narrow-reference" data-approved-screen="6" data-crop="528,607,844,1008" hidden>
      <svg class="reference-art" viewBox="528 607 316 401" role="img" aria-label="Team detail"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button class="screen-hotspot teacher-back" data-target="teacherMonitorView" aria-label="Back to teams"></button>
      <button class="screen-hotspot teacher-view-evaluation" data-target="teacherAssessmentView" aria-label="View full evaluation"></button>
    </section>

    <section id="teacherAssessmentView" class="teacher-view reference-screen teacher-eval-reference" data-approved-screen="7" data-crop="858,607,1195,1008" hidden>
      <svg class="reference-art" viewBox="858 607 337 401" role="img" aria-label="Oral assessment"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button class="screen-hotspot teacher-publish" data-target="teacherEvidenceView" aria-label="Publish result and open evidence"></button>
      <button class="screen-hotspot teacher-assessment-back" data-target="teacherTeamView" aria-label="Back to team detail"></button>
    </section>

    <section id="teacherEvidenceView" class="teacher-view reference-screen teacher-evidence-reference" data-approved-screen="8" data-crop="1210,607,1527,1008" hidden>
      <svg class="reference-art" viewBox="1210 607 317 401" role="img" aria-label="Evidence and transcription"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button class="screen-hotspot teacher-evidence-back" data-target="teacherAssessmentView" aria-label="Back to evaluation"></button>
    </section>

    <div class="preview-tools"><span>Standalone preview · Teacher</span><div class="preview-nav"><button id="previewPrevBtn" type="button">← Previous</button><button id="previewNextBtn" type="button">Next →</button><button id="standaloneLogoutBtn" type="button">Log out</button></div></div>

    <div class="compatibility-hooks" hidden>
      <div id="teamGrid"></div>
      <select id="activityMode"><option value="practice">Practice</option></select>
      <select id="twistSelect"><option value="remember-detail">Remember a detail</option></select>
      <div id="sessionState"></div>
    </div>
  </main>
  <script type="module" src="./teacher-app.mjs"></script>
</body>
</html>
