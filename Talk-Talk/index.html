<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Talk Talk — Student</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="reference-page" data-reference-source="a_clean_ui_ux_product_mockup_collage_with_multiple.png">
  <main class="reference-shell" aria-label="Talk Talk student preview">
    <section id="studentHomeView" class="student-view reference-screen is-active" data-approved-screen="1" data-crop="10,40,378,550">
      <svg class="reference-art" viewBox="10 40 368 510" role="img" aria-label="Talk Talk student home"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button id="continueAction" class="screen-hotspot student-continue" data-target="studentRecordingView" aria-label="Continue"></button>
    </section>

    <section id="studentRecordingView" class="student-view reference-screen" data-approved-screen="2" data-crop="392,40,760,550" hidden>
      <svg class="reference-art" viewBox="392 40 368 510" role="img" aria-label="Talk Talk recording"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button id="recordButton" class="screen-hotspot student-mic" aria-label="Microphone"></button>
      <button id="finishRecordingBtn" class="screen-hotspot student-finish" data-target="studentConversationView" aria-label="Finish recording"></button>
    </section>

    <section id="studentConversationView" class="student-view reference-screen" data-approved-screen="3" data-crop="776,40,1145,550" hidden>
      <svg class="reference-art" viewBox="776 40 369 510" role="img" aria-label="Talk Talk conversation"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button id="showPracticeResultBtn" class="screen-hotspot student-review" data-target="studentPracticeResultView" aria-label="Open speaking review"></button>
    </section>

    <section id="studentPracticeResultView" class="student-view reference-screen" data-approved-screen="4" data-crop="1160,40,1526,550" hidden>
      <svg class="reference-art" viewBox="1160 40 366 510" role="img" aria-label="Talk Talk speaking review"><image href="./reference/talk-talk-approved-8-screen-mockup.webp" x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"></image></svg>
      <button id="tryAgainBtn" class="screen-hotspot student-try-again" data-target="studentRecordingView" aria-label="Try again"></button>
      <button id="studentFullTranscriptBtn" class="screen-hotspot student-transcript" data-target="studentConversationView" aria-label="See full transcript"></button>
    </section>

    <div class="preview-tools">
      <span>Standalone preview · Student</span>
      <button id="standaloneLogoutBtn" type="button">Log out</button>
    </div>
    <span id="lessonPhase" hidden>Student activity</span>
    <div id="replayList" hidden></div>
    <p id="recordingState" hidden>Ready</p>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
