name: Verb Runner tests
on:
  push:
    branches:
      - feature/verb-runner
      - feature/verb-runner-v2-prototype
  pull_request:
    paths:
      - 'Verb-Runner/**'
      - 'Verb-Runner-V2/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Verb-Runner/*.test.js
      - run: node --check Verb-Runner/app.js
      - run: node --check Verb-Runner/phaser-runner.js
      - run: node --check Verb-Runner/runner-art.js
      - run: node --test Verb-Runner-V2/*.test.js
      - run: node --check Verb-Runner-V2/sentence-bank.js
      - run: node --check Verb-Runner-V2/prototype.js
