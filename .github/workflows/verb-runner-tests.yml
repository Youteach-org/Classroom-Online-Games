name: Verb Runner tests
on:
  push:
    branches:
      - feature/verb-runner
  pull_request:
    paths:
      - 'Verb-Runner/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Verb-Runner/*.test.js
