name: Restore DEA V15 S3
on:
  push:
    branches:
      - fix/dea-v15-s3-restore-20261025
  workflow_dispatch:

jobs:
  input-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test three-button contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            Medicine/AED-Trainer/firmware/aed-trainer/input-adapter.cpp \
            Medicine/AED-Trainer/firmware/tests/three-button-contract-test.cpp \
            -o /tmp/dea-three-button
          /tmp/dea-three-button
      - name: Test ESP32-S3 wiring
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            Medicine/AED-Trainer/firmware/tests/s3-hardware-contract-test.cpp \
            -o /tmp/dea-s3-wiring
          /tmp/dea-s3-wiring
      - name: Test SHOCK LED throughout the simulated recommendation cycle
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            Medicine/AED-Trainer/firmware/aed-trainer/trainer-core.cpp \
            Medicine/AED-Trainer/firmware/tests/shock-led-test.cpp \
            -o /tmp/dea-shock-led
          /tmp/dea-shock-led
      - name: Ensure approved CPR audio sources cannot be overwritten by downloads
        run: python3 -m unittest discover -s Medicine/AED-Trainer/audio/tools -p 'test_*.py'
      - name: Test full-volume startup and volume scaling
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            Medicine/AED-Trainer/firmware/tests/volume-control-test.cpp \
            -o /tmp/dea-volume
          /tmp/dea-volume
      - name: Test Teacher Monitor BLE client
        run: node --test Medicine/AED-Trainer/tests/ble-client.test.mjs
      - name: Verify original-color JPEG screen container
        run: |
          python3 -m pip install Pillow
          python3 -m unittest discover \
            -s Medicine/AED-Trainer/firmware/tests \
            -p 'test_*.py'
      - name: Run V15 Teacher Monitor regressions compatible with ESP32-S3 TFT hardware
        shell: bash
        run: |
          # These two historical source-text suites assert the retired OLED/five-button
          # ESP32-WROOM wiring. S3 functionality is covered by native contract tests,
          # firmware compilation, BLE tests and complete LittleFS image verification.
          mapfile -t tests < <(find Medicine/AED-Trainer/tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'audio-player-contract.test.mjs' \
            ! -name 'firmware-contract.test.mjs' | sort)
          printf 'Running %s compatible JS suites\n' "${#tests[@]}"
          node --test "${tests[@]}"

  compile-s3:
    needs: input-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
      - name: Set up ESP32-S3 compiler on GitHub runner
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "JPEGDEC"
      - name: Compile restored V15 for ESP32-S3
        run: |
          mkdir -p dist/build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=8M \
            --build-path "$GITHUB_WORKSPACE/dist/build" \
            Medicine/AED-Trainer/firmware/aed-trainer
          find dist/build -maxdepth 1 -name '*.bin' -print
      - name: Provide bundled FFmpeg without OS package-manager waits
        run: |
          python3 -m pip install --no-cache-dir imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/dea-ffmpeg"
          FFMPEG_BIN="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$FFMPEG_BIN"
          ln -s "$FFMPEG_BIN" "$RUNNER_TEMP/dea-ffmpeg/ffmpeg"
          echo "$RUNNER_TEMP/dea-ffmpeg" >> "$GITHUB_PATH"
          "$FFMPEG_BIN" -version | head -n 1
      - name: Prepare classroom voice pack
        run: |
          mkdir -p dist/classroom-source dist/classroom-audio
          cp Medicine/AED-Trainer/audio/assets/*.wav dist/classroom-source/

          python3 - <<'PY'
          import math, random, struct, wave
          from pathlib import Path

          root = Path("dist/classroom-source")
          rate = 16000

          def write_wav(path, samples):
              peak = max(1.0, max(abs(x) for x in samples))
              scale = 0.94 * 32767.0 / peak
              pcm = bytearray()
              for x in samples:
                  s = int(max(-32767, min(32767, x * scale)))
                  pcm += struct.pack("<h", s)
              with wave.open(str(path), "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(rate)
                  wf.writeframes(pcm)

          # Shock effect comes from the user-approved source file committed at
          # Medicine/AED-Trainer/audio/assets/fx-shock-electric.wav.
          # Do not synthesize or replace it here.

          # CPR beat: strong low thump + bright click, deliberately obvious on small speaker.
          dur = 0.16
          n = int(rate * dur)
          beat = []
          for i in range(n):
              t = i / rate
              env1 = math.exp(-t * 28.0)
              env2 = math.exp(-t * 52.0)
              thump = math.sin(2 * math.pi * 170 * t) * env1 * 1.25
              click = math.sin(2 * math.pi * 1250 * t) * env2 * 0.70
              attack = 1.0 if t < 0.010 else 0.0
              beat.append(thump + click + attack * (0.45 if (i % 2 == 0) else -0.45))
          write_wav(root / "fx-cpr-beat.wav", beat)
          PY

          for src in dist/classroom-source/*.wav; do
            dst="dist/classroom-audio/$(basename "$src")"
            case "$(basename "$src")" in
              fx-shock-electric.wav|aed-begin-cpr.wav|aed-continue-cpr.wav)
              # Preserve approved effects and CPR speech byte-for-byte.
              cp "$src" "$dst"
              continue
              ;;
            esac
            ffmpeg -hide_banner -loglevel error -y               -i "$src"               -af "highpass=f=140,lowpass=f=4500,acompressor=threshold=0.10:ratio=4:attack=5:release=100:makeup=2,loudnorm=I=-13:LRA=4:TP=-1.0,alimiter=limit=0.95"               -ac 1 -ar 10000 -c:a adpcm_ima_wav "$dst"
          done
          cmp dist/classroom-audio/aed-begin-cpr.wav Medicine/AED-Trainer/audio/assets/aed-begin-cpr.wav
          cmp dist/classroom-audio/aed-continue-cpr.wav Medicine/AED-Trainer/audio/assets/aed-continue-cpr.wav
          test "$(find dist/classroom-audio -maxdepth 1 -name '*.wav' | wc -l)" -eq 65

      - name: Build true-color JPEG display image for review
        run: |
          python3 -m pip install Pillow
          python3 Medicine/AED-Trainer/firmware/tools/build_display_jpeg_pack.py \
            --photo-dir Medicine/AED-Trainer/firmware/review-assets \
            --output dist/display-assets.dat
          test -s dist/display-assets.dat
          test "$(stat -c%s dist/display-assets.dat)" -lt 300000
      - name: Build LittleFS voice image
        run: |
          mkdir -p dist/littlefs-root/audio
          cp dist/classroom-audio/*.wav dist/littlefs-root/audio/
          cp dist/display-assets.dat dist/littlefs-root/display-assets.dat
          cp Medicine/AED-Trainer/firmware/rcp-music.wav dist/littlefs-root/audio/rcp-music.wav
          test -s dist/littlefs-root/display-assets.dat
          test -s dist/littlefs-root/audio/rcp-music.wav

          MKLITTLEFS="$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name mklittlefs | head -n 1)"
          if [ -z "$MKLITTLEFS" ]; then
            echo "mklittlefs was not found in ESP32 core tools"
            find "$HOME/.arduino15/packages/esp32/tools" -maxdepth 3 -type f | sort
            exit 1
          fi

          chmod +x "$MKLITTLEFS"
          "$MKLITTLEFS"             -c dist/littlefs-root             -p 256             -b 4096             -s 0x280000             dist/build/littlefs.bin


      - name: Merge V15 assets and firmware into ESP32-S3 flash image
        run: |
          python3 -m venv "$RUNNER_TEMP/dea-esptool"
          "$RUNNER_TEMP/dea-esptool/bin/pip" install esptool==5.6.0
          test -s dist/build/aed-trainer.ino.bootloader.bin
          test -s dist/build/aed-trainer.ino.partitions.bin
          test -s dist/build/aed-trainer.ino.bin
          test "$(stat -c%s dist/build/littlefs.bin)" -eq $((0x280000))
          test "$(stat -c%s dist/build/aed-trainer.ino.bin)" -le $((0x170000))
          "$RUNNER_TEMP/dea-esptool/bin/python" -m esptool --chip esp32s3 merge-bin \
            --flash-mode dio --flash-size 8MB \
            --output dist/build/firmware.merged.bin \
            0x0000 dist/build/aed-trainer.ino.bootloader.bin \
            0x8000 dist/build/aed-trainer.ino.partitions.bin \
            0x10000 dist/build/aed-trainer.ino.bin \
            0x180000 dist/build/littlefs.bin
          test -s dist/build/firmware.merged.bin
      - name: Verify whole V15 payload is in flash image
        run: |
          test -s dist/build/littlefs.bin
          test -s dist/build/firmware.merged.bin
          test "$(stat -c%s dist/display-assets.dat)" -lt 300000
          test "$(find dist/classroom-audio -maxdepth 1 -name '*.wav' | wc -l)" -eq 65
          test -s dist/littlefs-root/audio/rcp-music.wav
      - uses: actions/upload-artifact@v4
        with:
          name: dea-v15-s3-compiled
          path: dist/build/*.bin
          if-no-files-found: error

  package-windows-offline:
    needs: compile-s3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dea-v15-s3-compiled
          path: compiled
      - name: Embed V15 flash image and official USB flasher in EXE
        run: |
          set -eu
          mkdir -p DEA/offline/payload/tools
          cp compiled/firmware.merged.bin DEA/offline/payload/firmware.merged.bin
          test "$(stat -c%s DEA/offline/payload/firmware.merged.bin)" -gt 3000000
          curl --fail --location --retry 3 \
            https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-windows-amd64.zip \
            --output "$RUNNER_TEMP/esptool.zip"
          unzip -q "$RUNNER_TEMP/esptool.zip" -d DEA/offline/payload/tools
          test -n "$(find DEA/offline/payload/tools -iname 'esptool.exe' -print -quit)"
          cd DEA/offline/payload
          zip -qr ../payload.zip .
          cd ..
          ls -lh payload.zip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Build permanent offline Windows GUI
        run: |
          set -eu
          cd DEA/offline
          go mod init deaoffline
          go get github.com/lxn/walk@latest
          go mod tidy
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -manifest main.manifest -o rsrc.syso
          mkdir -p "$GITHUB_WORKSPACE/dist"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -H=windowsgui" \
            -o "$GITHUB_WORKSPACE/dist/DEA_Actualizador_Permanente.exe" .
          test -s "$GITHUB_WORKSPACE/dist/DEA_Actualizador_Permanente.exe"
          sha256sum "$GITHUB_WORKSPACE/dist/DEA_Actualizador_Permanente.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dea-v15-s3-offline-exe
          path: dist/DEA_Actualizador_Permanente.exe
          if-no-files-found: error

  smoke-test-windows:
    needs: package-windows-offline
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dea-v15-s3-offline-exe
          path: dist
      - name: Verify V15 EXE and embedded flasher work on Windows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/DEA_Actualizador_Permanente.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "DEA V15 self-test exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "DEA-Actualizador/selftest-error.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "Falló la prueba autónoma del instalador V15"
          }

  publish-direct-exe-preview:
    # Keep the approved stable release untouched until hardware review.
    if: github.event_name == 'push'
    needs: smoke-test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dea-v15-s3-offline-exe
          path: dist
      - name: Publish photographic review EXE as direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          test -s dist/DEA_Actualizador_Permanente.exe
          tag=dea-s3-gpio15-17-preview
          notes="Vista preliminar ESP32-S3 con MAX98357A: BCLK GPIO15, LRC GPIO16, DIN GPIO17; TFT GPIO8-12 intacta. Se integraron las dos locuciones RCP aprobadas (13 Lucía y 14 Continúe RCP) byte por byte en el paquete LittleFS, sin descargarlas ni reconstruirlas durante el instalador. GPIO21 controla el LED del botón SHOCK cuando la descarga es recomendada, con GPIO18 dedicado al pulsador. Los demás audios, música e imágenes continúan sin modificación. Pantalla y audio en hardware requieren comprobación física. Commit: $GITHUB_SHA."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/DEA_Actualizador_Permanente.exe --clobber
            gh release edit "$tag" --title "DEA ESP32-S3 — prueba fotos clínicas" --notes "$notes" --prerelease
          else
            gh release create "$tag" dist/DEA_Actualizador_Permanente.exe \
              --target "$GITHUB_SHA" --prerelease \
              --title "DEA ESP32-S3 — prueba fotos clínicas" --notes "$notes"
          fi

  publish-corrected-stable:
    # Publicación estable solo por ejecución manual o por commit explícito [DEA-STABLE].
    # Ambas rutas requieren compilar, probar y aprobar el self-test de Windows.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEA-STABLE]'))
    needs: smoke-test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dea-v15-s3-offline-exe
          path: dist
      - name: Replace incorrect stable EXE only after all tests passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view dea-updater-stable >/dev/null
          gh release upload dea-updater-stable dist/DEA_Actualizador_Permanente.exe --clobber
          gh release edit dea-updater-stable \
            --title "DEA V15 ESP32-S3 — Instalador permanente offline" \
            --notes "Restauración desde release/dea-v15: 32 pantallas, voces y música originales, casos clínicos y Teacher Monitor. Adaptado a ESP32-S3 N8R2, 3 botones y volumen 100% inicial. Compilación y pruebas de Windows completadas; pantalla/audio deben comprobarse en el equipo físico. No requiere descargas ni Arduino en la computadora del usuario."
