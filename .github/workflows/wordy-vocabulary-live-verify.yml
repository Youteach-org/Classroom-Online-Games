name: Wordy Vocabulary Live Verify
on:
  push:
    branches:
      - integration/wordy-vocabulary-diversity-20260924
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Verify live Wordy vocabulary diversity
        run: |
          cat > verify-wordy-vocabulary.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('console',msg=>{ if(msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror',err=>errors.push('pageerror: '+err.message));
          page.on('requestfailed',req=>errors.push('requestfailed: '+req.url()+' :: '+req.failure()?.errorText));

          async function inspect(level,minUnique,expectedPool){
            const url='https://classroom-online-games.pages.dev/Wordy/?level='+level+'&verify='+Date.now();
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>window.WordyPrototype?.controller?.state?.().board?.tiles?.length===49,{timeout:15000});
            const data=await page.evaluate(()=>{
              const state=window.WordyPrototype.controller.state();
              const counts={};
              for(const tile of state.board.tiles)counts[tile.word]=(counts[tile.word]||0)+1;
              return {
                title:document.title,
                levelId:state.levelId,
                tiles:state.board.tiles.length,
                activeRelations:state.activeRelationshipIds.length,
                uniqueWords:Object.keys(counts).length,
                maxCopies:Math.max(...Object.values(counts)),
                words:counts
              };
            });
            console.log(JSON.stringify({status:response?.status(),level,data},null,2));
            if(response?.status()!==200)throw new Error(level+': unexpected HTTP status');
            if(data.title!=='Wordy Prototype')throw new Error(level+': wrong title '+data.title);
            if(data.levelId!==level)throw new Error(level+': wrong active level '+data.levelId);
            if(data.tiles!==49)throw new Error(level+': expected 49 tiles, got '+data.tiles);
            if(data.activeRelations!==expectedPool)throw new Error(level+': expected pool '+expectedPool+', got '+data.activeRelations);
            if(data.uniqueWords<minUnique)throw new Error(level+': expected >= '+minUnique+' unique words, got '+data.uniqueWords);
            if(data.maxCopies>2)throw new Error(level+': expected max 2 copies, got '+data.maxCopies);
          }

          await inspect('A',34,24);
          await inspect('G',40,32);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('LIVE_WORDY_VOCABULARY_DIVERSITY_OK');
          await browser.close();
          EOF
          node verify-wordy-vocabulary.mjs
