name: Viewport Safe Overlay Regression

on:
  push:
    branches:
      - fix/viewport-safe-overlays
    paths:
      - "Verb-Runner/styles.css"
      - "Verb-Runner/index.html"
      - "Verb-Runner/tests/viewport-safe-layout.test.mjs"
      - ".github/workflows/viewport-safe-overlay-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full Verb Runner regression suite
        run: |
          node --check Verb-Runner/coastal-scene-config.mjs
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/prototype.js
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js
