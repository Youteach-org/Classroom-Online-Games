name: Wordy Density Live Check
on:
  push:
    branches:
      - integration/wordy-density-20260924
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical Wordy route and density runtime
        run: |
          set -euo pipefail
          base='https://classroom-online-games.pages.dev/Wordy'
          curl -fsSL --retry 5 --retry-delay 2 "$base/" -o /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 2 "$base/data/levels.mjs" -o /tmp/levels.mjs
          curl -fsSL --retry 5 --retry-delay 2 "$base/engine/controller.mjs" -o /tmp/controller.mjs
          curl -fsSL --retry 5 --retry-delay 2 "$base/engine/generator.mjs" -o /tmp/generator.mjs

          grep -q 'Wordy Prototype' /tmp/index.html
          grep -q "id:'A'.*moves:18.*target:900.*pool:12.*minMoves:8" /tmp/levels.mjs
          grep -q "id:'G'.*moves:26.*target:2300.*pool:20.*minMoves:12" /tmp/levels.mjs
          grep -q 'activeRelationshipIds' /tmp/controller.mjs
          grep -q 'roundBank' /tmp/controller.mjs
          grep -q 'selectRelationshipNeighborhood' /tmp/generator.mjs
          grep -q 'buildRelationGraph' /tmp/generator.mjs

          echo 'LIVE_WORDY_DENSITY_OK'
