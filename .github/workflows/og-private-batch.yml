name: Oral Grader encrypted one-shot batch
# October 2026 original eight-recording evaluation, encrypted inputs only.

on:
  push:
    branches:
      - feature/oral-grader-v1-20260922
      - feature/oral-grader-october-retry-20261025
    paths:
      - .github/workflows/og-private-batch.yml

permissions:
  contents: write

jobs:
  private-oral-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private audio analysis dependencies
        run: python -m pip install 'cryptography>=43,<52' 'google-genai>=1.30'
      - name: Run encrypted audio grading session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ORAL_GRADER_BATCH_MODEL: gemini-3-flash-preview
        run: python Oral-Grader/private_batch_worker.py

# Fresh original retry batch for transient Gemini 503, requested 2026-10-27.
