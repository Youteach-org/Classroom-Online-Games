name: Wordy POP Loop Live Verify
on:
  push:
    branches:
      - integration/wordy-pop-loop-20260925
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Verify live manual POP loop and A AN
        run: |
          cat > verify-live-wordy-pop.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('console',msg=>{ if(msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror',err=>errors.push('pageerror: '+err.message));
          page.on('requestfailed',req=>errors.push('requestfailed: '+req.url()+' :: '+req.failure()?.errorText));

          const response=await page.goto(
            'https://classroom-online-games.pages.dev/Wordy/?live-pop-verify='+Date.now(),
            {waitUntil:'networkidle',timeout:30000}
          );
          if(response?.status()!==200)throw new Error('Wordy HTTP '+response?.status());
          await page.waitForFunction(()=>window.WordyPrototype?.controller?.state?.().board?.tiles?.length===49,{timeout:15000});

          const result=await page.evaluate(async()=>{
            const stamp=Date.now();
            const {createGameController}=await import('/Wordy/engine/controller.mjs?v='+stamp);
            const {createRelationshipBank}=await import('/Wordy/engine/relationship-bank.mjs?v='+stamp);
            const {findMatches}=await import('/Wordy/engine/matcher.mjs?v='+stamp);
            const {renderGame}=await import('/Wordy/ui/render.mjs?v='+stamp);

            const entries=[
              {id:'look-after',category:'phrasal-verb',tokens:['LOOK','AFTER'],baseScore:120,difficulty:1},
              {id:'make-sense',category:'collocation',tokens:['MAKE','SENSE'],baseScore:120,difficulty:1},
              {id:'have-an-opinion',category:'collocation',tokens:['HAVE','AN','OPINION'],baseScore:180,difficulty:2}
            ];
            const bank=createRelationshipBank(entries);
            const boardRows=[
              ['LOOK','AFTER','X','Y','Z','Q','R'],
              ['MAKE','WENT','SENSE','SCHOOL','COLD','TIME','TRUTH'],
              ['HAVE','A','OPINION','FOOD','IDEA','WORK','RAIN'],
              ['AA','BB','CC','DD','EE','FF','GG'],
              ['HH','II','JJ','KK','LL','MM','NN'],
              ['OO','PP','SS','TT','UU','VV','WW'],
              ['XX','YY','ZZ','ONE','TWO','THREE','FOUR']
            ];
            const level={
              id:'LIVE',title:'Live POP',moves:3,
              goal:{type:'score',target:50},
              instruction:'Verify POP',
              generated:false,
              relationshipIds:['look-after','make-sense','have-an-opinion'],
              boardRows
            };

            const game=createGameController({bank,levels:[level],initialLevelId:'LIVE',rng:()=>0.41,storage:null});
            const before=game.state();
            if(!before.readyMatches.some(m=>m.relationshipId==='look-after'))throw new Error('initial LOOK AFTER not READY');
            if(!before.readyMatches.some(m=>m.relationshipId==='have-an-opinion'))throw new Error('A tile did not match HAVE AN OPINION');

            const opinionMatch=before.readyMatches.find(m=>m.relationshipId==='have-an-opinion');
            if(opinionMatch.tokens.join(' ')!=='HAVE AN OPINION')throw new Error('surface tokens lost AN');

            const didPop=game.pop();
            const after=game.state();
            if(!didPop)throw new Error('POP returned false');
            if(after.score<50)throw new Error('POP did not score');
            if(after.movesLeft!==3)throw new Error('POP consumed a move');
            if(after.phase!=='playing')throw new Error('POP ended round early: '+after.phase);
            if(after.success!==null)throw new Error('POP assigned result before moves ended');

            const finalLevel={...level,id:'FINAL',moves:0,goal:{type:'score',target:50}};
            const finalGame=createGameController({bank,levels:[finalLevel],initialLevelId:'FINAL',rng:()=>0.41,storage:null});
            const finalBefore=finalGame.state();
            const invalid=finalGame.attemptSwap(finalBefore.board.tiles[0].id,finalBefore.board.tiles[1].id);
            if(invalid.status!=='invalid')throw new Error('zero-move swap was allowed: '+invalid.status);
            if(!finalGame.pop())throw new Error('final free POP unavailable at zero moves');
            const finalAfter=finalGame.state();
            if(finalAfter.phase!=='result')throw new Error('final POP did not finish round');
            if(finalAfter.success!==true)throw new Error('final POP did not evaluate final objective');

            const articleBoard={
              rows:1,columns:3,
              tiles:[
                {id:'have',word:'HAVE',row:0,column:0},
                {id:'article',word:'A',row:0,column:1},
                {id:'opinion',word:'OPINION',row:0,column:2}
              ]
            };
            const articleMatches=findMatches(articleBoard,bank).filter(m=>m.relationshipId==='have-an-opinion');
            if(articleMatches.length!==1)throw new Error('live matcher did not accept A as AN');

            renderGame(document,{
              levelId:'VERIFY',levelTitle:'Verify',movesLeft:2,score:0,instruction:'',phase:'playing',eventLabel:'',
              board:{rows:7,columns:7,tiles:articleBoard.tiles},
              readyMatches:articleMatches,
              success:null
            });
            const renderedArticle=[...document.querySelectorAll('.wordy-tile')].find(el=>el.dataset.tileId==='article');
            if(!renderedArticle)throw new Error('rendered article tile missing');
            if(renderedArticle.textContent!=='AN')throw new Error('A tile did not render as AN: '+renderedArticle.textContent);

            return {
              productionTitle:document.title,
              earlyPop:{beforeMoves:before.movesLeft,afterMoves:after.movesLeft,score:after.score,phase:after.phase,success:after.success},
              finalPop:{swapStatus:invalid.status,phase:finalAfter.phase,success:finalAfter.success,score:finalAfter.score},
              article:{canonical:'A',surface:opinionMatch.tokens[1],rendered:renderedArticle.textContent}
            };
          });

          console.log(JSON.stringify(result,null,2));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('LIVE_WORDY_POP_LOOP_OK');
          await browser.close();
          EOF
          node verify-live-wordy-pop.mjs
