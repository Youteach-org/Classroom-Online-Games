name: Verb Runner Pronunciation Policy TDD

on:
  push:
    branches:
      - verb-pronunciation
    paths:
      - "Verb-Runner/scripts/generate-pronunciation.py"
      - "Verb-Runner/tests/pronunciation-policy.test.mjs"
      - ".github/workflows/verb-runner-pronunciation-policy-tdd.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test Verb-Runner/tests/pronunciation-policy.test.mjs
