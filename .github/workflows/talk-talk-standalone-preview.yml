name: Deploy Talk Talk standalone preview

on:
  push:
    branches:
      - talk-talk-standalone-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify standalone preview
        run: |
          node --check Talk-Talk/standalone-auth.mjs
          node --check Talk-Talk/login.mjs
          node --check Talk-Talk/app.mjs
          node --check Talk-Talk/teacher-app.mjs
          node --test Talk-Talk/tests/standalone-auth.test.mjs
          node --test Talk-Talk/tests/pixel-reference.test.mjs
          node --test Talk-Talk/tests/visual-contract.test.mjs
          node --test Talk-Talk/tests/individual-shell.test.mjs
          node --test Talk-Talk/tests/teacher-monitor.test.mjs
      - name: Validate canonical visual asset
        run: |
          test "$(stat -c '%s' Talk-Talk/reference/talk-talk-approved-8-screen-mockup.webp)" -eq 110770
          printf '%s  %s\n' "13861b09c2eb65ad144c3d4b3f2711acb973184ff69aab8fd242fb2b23545631" "Talk-Talk/reference/talk-talk-approved-8-screen-mockup.webp" | sha256sum -c -
          file Talk-Talk/reference/talk-talk-approved-8-screen-mockup.webp | grep -qi webp
      - name: Build preview
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R Talk-Talk dist/
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./Talk-Talk/login.html"><title>Talk Talk Preview</title></head>
          <body><p><a href="./Talk-Talk/login.html">Open Talk Talk</a></p></body></html>
          HTML
      - name: Normalize Cloudflare account id
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Deploy branch preview to Cloudflare Pages
        run: |
          npx wrangler@4 pages deploy dist --project-name=classroom-online-games --branch="${GITHUB_REF_NAME}" | tee wrangler-output.txt
          grep -Eo 'https://[^ ]+\.pages\.dev' wrangler-output.txt | tail -1 > deployment-url.txt
          test -s deployment-url.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save preview URL
        uses: actions/upload-artifact@v4
        with:
          name: talk-talk-preview-url
          path: deployment-url.txt
