name: Oral Grader Stage 3 Tests

"on":
  push:
    branches:
      - feature/oral-grader-talk-talk-online-20260928
    paths:
      - Oral-Grader/stage3/**
      - Oral-Grader/online/**
      - Oral-Grader/tests/test-stage3-rubric-scoring.py
      - Oral-Grader/tests/test-online-job-service.py
      - Oral-Grader/tests/test-firebase-online-boundary.py
      - Oral-Grader/tests/test-online-processor.py
      - firebase.json
      - .github/workflows/oral-grader-stage3-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run complete Oral Grader unit suite
        run: |
          python -m pytest -q \
            Oral-Grader/tests/test-gemini-transcribe.py \
            Oral-Grader/tests/test-stage2-audio-analysis.py \
            Oral-Grader/tests/test-stage3-rubric-scoring.py \
            Oral-Grader/tests/test-online-job-service.py \
            Oral-Grader/tests/test-firebase-online-boundary.py \
            Oral-Grader/tests/test-online-processor.py
