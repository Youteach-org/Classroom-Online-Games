name: Backup Pronunciation Review

on:
  push:
    branches:
      - main
    paths:
      - "Verb-Runner/pronunciation-review/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download live pronunciation review data
        run: |
          mkdir -p docs/superpowers/audits
          curl -fsS             "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationReview.json"             -o /tmp/pronunciation-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('/tmp/pronunciation-review.json')
          target=Path('docs/superpowers/audits/pronunciation-review-live-backup.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          if data is None:
              data={}
          target.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Commit changed backup
        run: |
          if git diff --quiet -- docs/superpowers/audits/pronunciation-review-live-backup.json; then
            echo "No pronunciation review backup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/audits/pronunciation-review-live-backup.json
          git commit -m "chore: backup pronunciation review log [skip review backup]"
          git push origin HEAD:main
