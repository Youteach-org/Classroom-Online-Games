name: Sync Pronunciation Review

on:
  push:
    branches:
      - main
    paths:
      - "Verb-Runner/pronunciation-review/**"
      - "Verb-Runner/bella-samples/**"
      - "Verb-Runner/scripts/apply-pronunciation-duplicates.py"
      - "Verb-Runner/scripts/apply-pronunciation-validation-decisions.py"
      - "Verb-Runner/scripts/migrate-pronunciation-decision-console.py"
      - "Verb-Runner/scripts/generate-pronunciation.py"
      - "Verb-Runner/pronunciation-corrections.json"
      - "Verb-Runner/tests/pronunciation-review.test.mjs"
      - ".github/workflows/pronunciation-review-backup.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: pronunciation-review-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download live review data
        run: |
          mkdir -p docs/superpowers/audits
          curl -fsS \
            "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationReview.json" \
            -o /tmp/pronunciation-review.json
          curl -fsS \
            "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/bellaSampleReview.json" \
            -o /tmp/bella-round1.json
          curl -fsS \
            "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/bellaSampleReviewRound2.json" \
            -o /tmp/bella-round2.json
          curl -fsS \
            "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationDecisionConsole.json" \
            -o /tmp/pronunciation-decision-console.json

      - name: Migrate legacy Bella decisions into unified console
        run: |
          python Verb-Runner/scripts/migrate-pronunciation-decision-console.py \
            /tmp/bella-round1.json \
            /tmp/bella-round2.json \
            /tmp/pronunciation-decision-console.json

          if [ "$(python -c 'import json; print(len(json.load(open("/tmp/pronunciation-decision-console-migration-patch.json"))))')" != "0" ]; then
            curl -fsS -X PATCH \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/pronunciation-decision-console-migration-patch.json \
              "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationDecisionConsole.json"
          fi

          curl -fsS \
            "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationDecisionConsole.json" \
            -o /tmp/pronunciation-decision-console.json

      - name: Generate Bella round 3 candidates
        shell: bash
        run: |
          set -euo pipefail
          count=0
          if [ -d Verb-Runner/bella-samples/round3-audio ]; then
            count="$(find Verb-Runner/bella-samples/round3-audio -type f -name '*.wav' | wc -l)"
          fi
          if [ -f Verb-Runner/bella-samples/round3-manifest.json ] && [ "$count" -ge 6 ]; then
            echo "Bella round 3 assets already exist; skipping generation."
          else
            python -m pip install --disable-pip-version-check "kokoro>=0.9.4" "soundfile>=0.12" "numpy>=1.26"
            python Verb-Runner/scripts/generate-bella-round3.py
          fi

      - name: Apply validated pronunciation review decisions
        run: |
          python Verb-Runner/scripts/apply-pronunciation-validation-decisions.py /tmp/pronunciation-review.json

      - name: Convert duplicate cleanup requests into aliases
        run: |
          python Verb-Runner/scripts/apply-pronunciation-duplicates.py /tmp/pronunciation-review.json

      - name: Consolidate pronunciation assets
        shell: bash
        run: |
          set -euo pipefail
          if python Verb-Runner/scripts/generate-pronunciation.py; then
            echo "All pronunciation assets already exist; no synthesis needed."
          else
            echo "A pronunciation asset is missing; installing Kokoro only for this repair run."
            python -m pip install --disable-pip-version-check "kokoro>=0.9.4" "soundfile>=0.12" "numpy>=1.26"
            ALLOW_KOKORO_BELLA_GENERATION=1 python Verb-Runner/scripts/generate-pronunciation.py
          fi

      - name: Verify pronunciation integration
        run: |
          node --test Verb-Runner/tests/pronunciation.test.mjs
          node --test Verb-Runner/tests/pronunciation-policy.test.mjs
          node --test Verb-Runner/tests/pronunciation-review.test.mjs

      - name: Update GitHub review backups
        run: |
          cp /tmp/pronunciation-review.json \
            docs/superpowers/audits/pronunciation-review-live-backup.json
          cp /tmp/bella-round1.json \
            docs/superpowers/audits/bella-sample-review-live-backup.json
          cp /tmp/pronunciation-decision-console.json \
            docs/superpowers/audits/pronunciation-decision-console-live-backup.json

      - name: Commit review backups and deduplicated assets
        shell: bash
        run: |
          TRACKED=(
            docs/superpowers/audits/pronunciation-review-live-backup.json
            docs/superpowers/audits/bella-sample-review-live-backup.json
            docs/superpowers/audits/pronunciation-decision-console-live-backup.json
            Verb-Runner/pronunciation-aliases.json
            Verb-Runner/pronunciation-manifest.js
            Verb-Runner/audio/pronunciation
            Verb-Runner/bella-samples/round3-manifest.json
            Verb-Runner/bella-samples/round3-audio
          )

          if [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "No pronunciation review sync changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TRACKED[@]}"
          git commit -m "chore: sync pronunciation review and decision console [skip review backup]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Finalize pronunciation review changes in Firebase
        run: |
          if [ "$(python -c 'import json; print(len(json.load(open("/tmp/pronunciation-cleanup-firebase-patch.json"))))')" != "0" ]; then
            curl -fsS -X PATCH \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/pronunciation-cleanup-firebase-patch.json \
              "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationReview.json"
          fi

          if [ "$(python -c 'import json; print(len(json.load(open("/tmp/pronunciation-validation-firebase-patch.json"))))')" != "0" ]; then
            curl -fsS -X PATCH \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/pronunciation-validation-firebase-patch.json \
              "https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationReview.json"
          fi
