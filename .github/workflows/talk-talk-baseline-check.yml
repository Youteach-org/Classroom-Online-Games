name: Talk Talk baseline check
on:
  push:
    branches:
      - talk-talk-baseline-check-20260923
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - youteach-team-context.test.mjs
          - live-bootstrap.test.mjs
          - result-submit.test.mjs
    name: baseline / ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v5
      - run: node --test "Talk-Talk/tests/${{ matrix.test }}"
