name: Verb Runner ambiguous pronunciation full verification

on:
  push:
    branches:
      - fix/verb-runner-ambiguous-pronunciations
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript modules
        run: |
          node --check Verb-Runner/coastal-scene-config.mjs
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/prototype.js
          node --check Verb-Runner/pronunciation.js
      - name: Verify approved pronunciation assets
        run: python Verb-Runner/scripts/generate-pronunciation.py
      - name: Verify generated manifest is committed
        run: git diff --exit-code -- Verb-Runner/pronunciation-manifest.js Verb-Runner/audio/pronunciation
      - name: Run all Verb Runner regression tests
        run: |
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js
