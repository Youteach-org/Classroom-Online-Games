name: Pronunciation duplicate deletion verification

on:
  push:
    branches:
      - fix/pronunciation-duplicate-delete
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify JavaScript and tests
        run: |
          node --check Verb-Runner/pronunciation-review/review-events.js
          node --check Verb-Runner/pronunciation-review/review-actions.js
          node --check Verb-Runner/pronunciation-review/review-render.js
          node --test Verb-Runner/tests/pronunciation-review.test.mjs
          node --test Verb-Runner/tests/pronunciation.test.mjs
          node --test Verb-Runner/tests/pronunciation-policy.test.mjs

      - name: Simulate physical deduplication
        run: |
          cat >/tmp/review.json <<'JSON'
          {
            "audios": {
              "synthetic-bent": {
                "key": "bent",
                "duplicateOf": "bend",
                "duplicateOfRef": 28,
                "cleanupRequested": true,
                "removedAsDuplicate": true,
                "status": "removed-duplicate"
              }
            }
          }
          JSON
          test -f Verb-Runner/audio/pronunciation/bent-042ee58d65.wav
          python Verb-Runner/scripts/apply-pronunciation-duplicates.py /tmp/review.json
          python Verb-Runner/scripts/generate-pronunciation.py
          python - <<'PY'
          import json, re
          from pathlib import Path
          aliases=json.loads(Path('Verb-Runner/pronunciation-aliases.json').read_text())
          assert aliases['bent']=='bend'
          text=Path('Verb-Runner/pronunciation-manifest.js').read_text()
          payload=text.split('=',1)[1].rsplit(';})',1)[0]
          manifest=json.loads(payload)
          assert manifest['bent']==manifest['bend'], (manifest['bent'],manifest['bend'])
          assert not Path('Verb-Runner/audio/pronunciation/bent-042ee58d65.wav').exists()
          review=json.loads(Path('/tmp/review.json').read_text())
          row=review['audios']['synthetic-bent']
          assert row['cleanupRequested'] is False
          assert row['cleanupApplied'] is True
          print('Synthetic duplicate physically consolidated successfully.')
          PY

      - name: Ensure normal branch starts clean
        run: |
          git reset --hard HEAD
          python Verb-Runner/scripts/generate-pronunciation.py
          git diff --exit-code -- Verb-Runner/pronunciation-manifest.js Verb-Runner/audio/pronunciation
