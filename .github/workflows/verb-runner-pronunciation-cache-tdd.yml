name: Verb Runner Pronunciation Cache TDD

on:
  push:
    branches:
      - verb-pronunciation
    paths:
      - "Verb-Runner/index.html"
      - "Verb-Runner/tests/pronunciation-policy.test.mjs"
      - ".github/workflows/verb-runner-pronunciation-cache-tdd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test Verb-Runner/tests/pronunciation-policy.test.mjs
