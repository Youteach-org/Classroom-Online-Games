name: Wordy Branch Tests

on:
  push:
    branches:
      - feature/wordy-game
    paths:
      - 'Wordy/**'
      - 'index.html'
      - '.github/workflows/wordy-branch-tests.yml'
      - '.github/workflows/cloudflare-pages-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Wordy browser module syntax
        run: node --check Wordy/app.mjs

      - name: Run Wordy regression suite
        run: node --test Wordy/tests/*.test.mjs
