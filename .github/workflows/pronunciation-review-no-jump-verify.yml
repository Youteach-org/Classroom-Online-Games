name: Pronunciation review no-jump verification

on:
  push:
    branches:
      - fix/pronunciation-review-no-jump
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check Verb-Runner/pronunciation-review/review-app.js
          node --test Verb-Runner/tests/pronunciation-review.test.mjs
