name: Oral Grader Gemini quota diagnostic
on:
  push:
    branches:
      - feature/oral-grader-v1-20260922
    paths:
      - .github/workflows/og-api-diagnostic.yml
permissions:
  contents: read
jobs:
  gemini-quota-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-genai>=1.30'
      - name: Check original primary Gemini quota without student data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from google import genai
          key = os.environ['GEMINI_API_KEY']
          client = genai.Client(api_key=key)
          try:
              response = client.models.generate_content(model='gemini-3-flash-preview', contents='Reply OK.')
              print('GEMINI_QUOTA_PROBE_OK', bool(response.text), flush=True)
          except Exception as error:
              print('GEMINI_QUOTA_PROBE_ERROR', type(error).__name__, getattr(error, 'code', None), flush=True)
              print(str(error).replace(key, '[REDACTED]')[:5000], flush=True)
          finally:
              client.close()
          PY
