name: Wordy Uniform Cell CI
on:
  push:
    branches: [feature/wordy-game]
    paths:
      - 'Wordy/**'
      - '.github/workflows/wordy-uniform-cell-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run focused Wordy tests
        run: node --test Wordy/tests/resolution.test.mjs Wordy/tests/timeline.test.mjs
      - name: Syntax check
        run: node --check Wordy/app.mjs
