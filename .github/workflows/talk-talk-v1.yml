name: Talk Talk V1 CI

on:
  push:
    branches:
      - feature/talk-talk-v1-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shared COG tests
        run: node --test tests/*.test.mjs
      - name: Run Talk Talk tests
        run: node --test Talk-Talk/tests/*.test.mjs
      - name: Run Verb Runner tests
        run: node --test Verb-Runner/tests/*.test.mjs
      - name: Run Support Meter tests
        run: node --test Support-Meter/*.test.js Support-Meter/*.test.mjs
      - name: Run 100 Students Said tests
        run: cd 100-Students-Said && node --test *.test.js

  deploy-preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare COG preview site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R 100-Students-Said OSASCOMP Support-Meter Verb-Runner Talk-Talk Engineering teacher shared dist/
      - name: Normalize Cloudflare account id
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          test -n "$CLEAN_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy isolated Talk Talk preview
        run: npx wrangler@4 pages deploy dist --project-name=classroom-online-games --branch=talk-talk-v1-20260921 --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify-preview:
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - name: Probe Talk Talk preview over HTTP
        run: |
          set -eu
          BASE="https://talk-talk-v1-20260921.classroom-online-games.pages.dev"
          curl -fsS --retry 8 --retry-delay 3 "$BASE/Talk-Talk/" -o /tmp/student.html
          curl -fsS --retry 8 --retry-delay 3 "$BASE/Talk-Talk/teacher.html" -o /tmp/teacher.html
          curl -fsS --retry 8 --retry-delay 3 "$BASE/Talk-Talk/creator.html" -o /tmp/creator.html
          curl -fsS --retry 8 --retry-delay 3 "$BASE/Talk-Talk/app.mjs" -o /tmp/app.mjs
          grep -Fq '<title>Talk Talk</title>' /tmp/student.html
          grep -Fq 'Teacher Monitor' /tmp/teacher.html
          grep -Fq 'Test as Student' /tmp/creator.html
          grep -Fq 'talkTalk.previewDraft' /tmp/app.mjs
      - name: Browser-load Talk Talk shells
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || (echo "::error::No Chrome browser on runner" && exit 1)
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom             https://talk-talk-v1-20260921.classroom-online-games.pages.dev/Talk-Talk/ > /tmp/student-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom             https://talk-talk-v1-20260921.classroom-online-games.pages.dev/Talk-Talk/teacher.html > /tmp/teacher-dom.html
          grep -Fq 'Ready to speak?' /tmp/student-dom.html
          grep -Fq 'Teacher Monitor' /tmp/teacher-dom.html
