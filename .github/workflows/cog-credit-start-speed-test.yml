name: COG Credit Starting Speed Regression

on:
  push:
    branches:
      - feature/cog-credit-start-speed-v2
    paths:
      - "Verb-Runner/index.html"
      - "Verb-Runner/styles.css"
      - "Verb-Runner/prototype.js"
      - "Verb-Runner/tests/cog-brand-start-speed.test.mjs"
      - ".github/workflows/cog-credit-start-speed-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run COG credit and starting speed tests
        run: node --test Verb-Runner/tests/cog-brand-start-speed.test.mjs
