name: COG Credit Starting Speed Regression

on:
  push:
    branches:
      - feature/cog-credit-start-speed-v2
    paths:
      - "Verb-Runner/index.html"
      - "Verb-Runner/styles.css"
      - "Verb-Runner/prototype.js"
      - "Verb-Runner/tests/cog-brand-start-speed.test.mjs"
      - ".github/workflows/cog-credit-start-speed-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full Verb Runner regression suite
        run: |
          node --check Verb-Runner/coastal-scene-config.mjs
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/prototype.js
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js
