name: Wordy Live Animation Diagnose
on:
  push:
    branches:
      - integration/wordy-pop-loop-20260925
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Inspect actual POP animation calls
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:430,height:900}});
          await page.goto('https://classroom-online-games.pages.dev/Wordy/?diag='+Date.now(),{waitUntil:'networkidle',timeout:30000});
          await page.waitForFunction(()=>window.WordyPrototype?.controller?.state?.().board?.tiles?.length===49);

          const out=await page.evaluate(async()=>{
            const stamp=Date.now();
            const {RELATIONSHIPS}=await import('/Wordy/data/relationships.mjs?v='+stamp);
            const {createRelationshipBank}=await import('/Wordy/engine/relationship-bank.mjs?v='+stamp);
            const {findImmediateScoringMoves}=await import('/Wordy/engine/generator.mjs?v='+stamp);
            const controller=window.WordyPrototype.controller;
            const state=controller.state();
            const full=createRelationshipBank(RELATIONSHIPS);
            const activeEntries=state.activeRelationshipIds.map(id=>full.byId.get(id));
            const roundBank=createRelationshipBank(activeEntries);
            const moves=findImmediateScoringMoves(state.board,roundBank);
            if(!moves.length)throw new Error('no productive move');
            const chosen=moves[0].swap;

            const calls=[];
            const original=Element.prototype.animate;
            Element.prototype.animate=function(keyframes,options){
              calls.push({
                id:this.dataset?.tileId??'',
                keyframes:structuredClone(keyframes),
                duration:options?.duration??null
              });
              return original.call(this,keyframes,options);
            };

            const result=controller.attemptSwap(chosen.fromTileId,chosen.toTileId);
            if(result.status!=='accepted')throw new Error('productive swap not accepted');
            await new Promise(r=>setTimeout(r,220));
            document.querySelector('#popButton').click();
            await new Promise(r=>setTimeout(r,1600));
            Element.prototype.animate=original;

            const gravity=calls.filter(call=>
              Array.isArray(call.keyframes)&&
              call.keyframes.some(frame=>typeof frame?.transform==='string'&&frame.transform.startsWith('translate('))
            );
            const refill=calls.filter(call=>
              Array.isArray(call.keyframes)&&
              call.keyframes.some(frame=>typeof frame?.transform==='string'&&frame.transform.startsWith('translateY('))
            );
            const removal=calls.filter(call=>
              Array.isArray(call.keyframes)&&
              call.keyframes.some(frame=>frame?.transform==='scale(.18)')
            );
            return {
              chosen,
              totalAnimationCalls:calls.length,
              removalCount:removal.length,
              gravityCount:gravity.length,
              refillCount:refill.length,
              gravitySample:gravity.slice(0,8),
              refillSample:refill.slice(0,8),
              finalState:{phase:controller.state().phase,movesLeft:controller.state().movesLeft,tiles:controller.state().board.tiles.length}
            };
          });
          console.log(JSON.stringify(out,null,2));
          await browser.close();
          EOF
          node diagnose.mjs
