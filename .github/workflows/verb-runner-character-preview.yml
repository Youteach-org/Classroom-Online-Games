name: Deploy Verb Runner Character Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Verb-Runner/character-viewer.html'
      - 'Verb-Runner/scripts/refine-alex.py'
      - '.github/workflows/verb-runner-character-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare character preview
        run: |
          rm -rf preview-dist
          mkdir preview-dist
          cp Verb-Runner/character-viewer.html preview-dist/index.html
          curl --fail --location --retry 3 \
            'https://storage.to3d.app/generated-3d/models/2026-09-23/task_cee9ef71-b87a-4a01-973f-89a5d326cf95_model.glb' \
            --output preview-dist/red-runner.glb
          test -s preview-dist/red-runner.glb

      - name: Install refinement dependencies
        run: |
          python -m pip install --quiet trimesh numpy networkx pillow opencv-python-headless

      - name: Refine ALEX gameplay view
        run: |
          python Verb-Runner/scripts/refine-alex.py preview-dist/red-runner.glb preview-dist/red-runner.glb

      - name: Inspect connected components
        run: |
          python <<'PY'
          import trimesh, numpy as np
          s=trimesh.load('preview-dist/red-runner.glb', force='scene')
          print('GEOMETRIES', len(s.geometry))
          for name,g in s.geometry.items():
              print('GEOMETRY', name, 'EXTENTS', np.asarray(g.extents).tolist(), 'BOUNDS', np.asarray(g.bounds).tolist())
              try:
                  parts=g.split(only_watertight=False)
                  print('COMPONENTS', name, len(parts))
                  for i,p in enumerate(parts[:30]):
                      print('COMP', name, i, 'EXTENTS', np.asarray(p.extents).tolist(), 'CENTER', np.asarray(p.bounds).mean(axis=0).tolist(), 'VERTS', len(p.vertices), 'FACES', len(p.faces))
              except Exception as e:
                  print('SPLIT_ERROR', name, repr(e))
          PY

      - name: Reject flat card geometry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const b = fs.readFileSync('preview-dist/red-runner.glb');
          if (b.toString('utf8',0,4) !== 'glTF') throw new Error('Not a GLB file');
          let off = 12, json = null;
          while (off + 8 <= b.length) {
            const len = b.readUInt32LE(off);
            const type = b.readUInt32LE(off + 4);
            const chunk = b.subarray(off + 8, off + 8 + len);
            if (type === 0x4E4F534A) json = JSON.parse(chunk.toString('utf8').replace(/\0+$/,'').trim());
            off += 8 + len;
          }
          if (!json) throw new Error('No GLB JSON chunk');
          const mins=[Infinity,Infinity,Infinity], maxs=[-Infinity,-Infinity,-Infinity];
          let found=0;
          for (const mesh of json.meshes || []) for (const p of mesh.primitives || []) {
            const ai = p.attributes && p.attributes.POSITION;
            if (ai == null) continue;
            const a = json.accessors[ai];
            if (!a || !a.min || !a.max) continue;
            found++;
            for (let k=0;k<3;k++){ mins[k]=Math.min(mins[k],a.min[k]); maxs[k]=Math.max(maxs[k],a.max[k]); }
          }
          if (!found) throw new Error('No POSITION bounds');
          const d=maxs.map((v,i)=>v-mins[i]).sort((a,b)=>a-b);
          const ratio=d[0]/d[1];
          console.log('MODEL_DIMS_SORTED', d.join(','));
          console.log('THINNESS_RATIO', ratio);
          if (!(ratio > 0.12)) throw new Error('Generated model is still effectively a flat card/billboard');
          NODE

      - name: Upload current ALEX model
        uses: actions/upload-artifact@v4
        with:
          name: alex-current-glb
          path: preview-dist/red-runner.glb
          retention-days: 7

      - name: Normalize Cloudflare account ID
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy interactive character preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy preview-dist \
            --project-name=classroom-online-games \
            --branch=vr-character-preview \
            --commit-hash=${{ github.sha }}
