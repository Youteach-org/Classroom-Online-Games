name: Verify Verb Runner reported audio batch 2026-09-19

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-verb-runner-reported-batch-20260919.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh BUILD with a distinct approved fancy take
        run: |
          set -euo pipefail
          target="Verb-Runner/audio/pronunciation/external/build-fancy-approved-r2.mp3"
          curl -fL --retry 3 --retry-delay 2             "https://www.aidocmaker.com/g0/audio?name=568cdc6dfc334108927b46d34e33b5ef"             -o "$target"
          test "$(wc -c < "$target")" -gt 1000
          file "$target"

      - name: Verify pronunciation regression tests
        run: |
          node --test Verb-Runner/tests/pronunciation.test.mjs
          node --test Verb-Runner/tests/pronunciation-policy.test.mjs
          node --test Verb-Runner/tests/pronunciation-review.test.mjs

      - name: Commit BUILD only if the refreshed fancy take differs
        run: |
          set -euo pipefail
          if git diff --quiet -- Verb-Runner/audio/pronunciation/external/build-fancy-approved-r2.mp3; then
            echo "BUILD fancy take is byte-identical; no extra commit required."
            exit 0
          fi
          changed="$(git status --porcelain | sed -E 's/^.. //' || true)"
          test "$changed" = "Verb-Runner/audio/pronunciation/external/build-fancy-approved-r2.mp3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Verb-Runner/audio/pronunciation/external/build-fancy-approved-r2.mp3
          git commit -m "Verb Runner: refresh approved fancy BUILD clip"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify the six repaired records are REVIEW AGAIN
        env:
          FIREBASE_URL: https://youteach-d9a79-default-rtdb.firebaseio.com/classroomGames/verbRunnerV2/pronunciationReview.json
        run: |
          set -euo pipefail
          curl -fsS "$FIREBASE_URL" -o /tmp/review.json
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path("/tmp/review.json").read_text())
          expected={
            "am going to study":"./audio/pronunciation/am-going-to-study-5a392ee888.wav",
            "am staying":"./audio/pronunciation/am-staying-a553b58724.wav",
            "build":"./audio/pronunciation/external/build-fancy-approved-r2.mp3",
            "change":"./audio/pronunciation/change-bd120a6a04.wav",
            "follow":"./audio/pronunciation/follow-480c42c110.wav",
            "forbade":"./audio/pronunciation/forbade-92e23a6543.wav",
          }
          seen={}
          for aid,r in (data.get("audios") or {}).items():
            if isinstance(r,dict) and r.get("key") in expected:
              seen[r["key"]]={"status":r.get("status"),"source":r.get("source"),"history":r.get("history") or {}}
          missing=set(expected)-set(seen)
          if missing:
            raise SystemExit("Missing targets: "+", ".join(sorted(missing)))
          for key,src in expected.items():
            rec=seen[key]
            if rec["status"]!="review-again":
              raise SystemExit(f"{key} status is {rec['status']!r}, expected review-again")
            if rec["source"]!=src:
              raise SystemExit(f"{key} source is {rec['source']!r}, expected {src!r}")
            if not any(isinstance(ev,dict) and ev.get("action")=="repair-applied-review-again" for ev in rec["history"].values()):
              raise SystemExit(f"{key} is missing repair history")
          print("Verified REVIEW AGAIN + history for:")
          for key in expected:
            print(f"- {key}: {seen[key]['source']}")
          PY
