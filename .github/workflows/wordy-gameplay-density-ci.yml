name: Wordy Gameplay Density CI
on:
  push:
    branches:
      - feature/wordy-game
    paths:
      - 'Wordy/**'
      - 'tests/wordy-production-deploy.test.mjs'
      - '.github/workflows/wordy-gameplay-density-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full Wordy suite
        run: node --test Wordy/tests/*.test.mjs
      - name: Run production deploy guard
        run: node --test tests/wordy-production-deploy.test.mjs
      - name: Syntax check
        run: node --check Wordy/app.mjs
