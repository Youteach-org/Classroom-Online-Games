name: Verb Runner 2.5 Branch Verification

on:
  push:
    branches:
      - feature/verb-runner-2-5-learning-loop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check Verb-Runner/run-director.js
          node --check Verb-Runner/prototype.js

      - name: Run Verb Runner regression tests
        run: |
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js
