name: Oral Grader V1 - Gemini Stage 3 Rubric

"on":
  workflow_dispatch:
    inputs:
      pair_slug:
        description: Pair slug, for example paul-paulina
        required: true
        type: string

permissions:
  contents: write

env:
  ORAL_GRADER_RUBRIC_MODEL: gemini-3.5-flash-lite

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Oral Grader dependencies
        run: python -m pip install --disable-pip-version-check pytest google-genai

      - name: Run complete Oral Grader unit suite
        run: python -m pytest -q Oral-Grader/tests

      - name: Resolve Stage-3 evidence
        env:
          PAIR_SLUG: ${{ inputs.pair_slug }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pair_slug = os.environ["PAIR_SLUG"].strip()
          if not pair_slug or not pair_slug.replace("-", "").isalnum():
              raise SystemExit("pair_slug must contain only letters, numbers, and hyphens")

          stage1 = Path("Oral-Grader/transcripts") / f"{pair_slug}-stage1.json"
          stage2 = Path("Oral-Grader/analysis") / f"{pair_slug}-stage2.json"
          review = Path("Oral-Grader/reviews") / f"{pair_slug}-stage2-review.json"
          calibration = Path("Oral-Grader/rubrics/units-1-4-scoring-calibration.md")

          for path in (stage1, stage2, review, calibration):
              if not path.is_file():
                  raise SystemExit(f"Missing Stage-3 input: {path}")

          review_data = json.loads(review.read_text(encoding="utf-8"))
          if not review_data.get("accepted_for_rubric"):
              raise SystemExit("Stage 2 is not accepted for rubric scoring")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PAIR_SLUG={pair_slug}\n")
              env.write(f"STAGE1_PATH={stage1}\n")
              env.write(f"STAGE2_PATH={stage2}\n")
              env.write(f"REVIEW_PATH={review}\n")
              env.write(f"CALIBRATION_PATH={calibration}\n")
          PY

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "Gemini API key secret is not configured." >&2
            exit 2
          fi

      - name: Run automatic rubric scoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          mkdir -p Oral-Grader/rubrics
          python Oral-Grader/stage3/score-rubric.py             --pair-slug "$PAIR_SLUG"             --stage1 "$STAGE1_PATH"             --stage2 "$STAGE2_PATH"             --review "$REVIEW_PATH"             --calibration "$CALIBRATION_PATH"             --output-json "Oral-Grader/rubrics/${PAIR_SLUG}-stage3.json"             --output-md "Oral-Grader/rubrics/${PAIR_SLUG}-stage3.md"

      - name: Validate Stage-3 result
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("Oral-Grader/rubrics") / f"{os.environ['PAIR_SLUG']}-stage3.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["project"] == "Oral-Grader"
          assert data["stage"] == 3
          assert data["scoring_status"] == "automatic_rubric_complete"
          assert data["students"]
          for student in data["students"]:
              scores = student["rubric_scores"]
              assert len(scores) == 5
              assert all(isinstance(v, int) and 0 <= v <= 8 for v in scores.values())
              assert student["total"] == sum(scores.values())
              assert 0 <= student["total"] <= 40
          print(f"Validated {len(data['students'])} Stage-3 student score(s)")
          PY

      - name: Commit Stage-3 rubric
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "Oral-Grader/rubrics/${PAIR_SLUG}-stage3.json"             "Oral-Grader/rubrics/${PAIR_SLUG}-stage3.md"
          if git diff --cached --quiet; then
            echo "No Stage-3 rubric changes to commit."
            exit 0
          fi
          git commit -m "data(og): add ${PAIR_SLUG} automatic Stage-3 rubric"
          git push
