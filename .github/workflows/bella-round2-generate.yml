name: Generate Bella failed-word round 2

on:
  push:
    branches:
      - feat/bella-failed-round2
    paths:
      - "Verb-Runner/scripts/generate-bella-round2.py"
      - "Verb-Runner/bella-samples/round2.html"
      - ".github/workflows/bella-round2-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bella-failed-round2
  cancel-in-progress: true

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated bella round2]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro>=0.9.4" numpy soundfile
      - name: Generate exact af_bella round 2
        run: python Verb-Runner/scripts/generate-bella-round2.py
      - name: Verify files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('Verb-Runner/bella-samples')
          data=json.loads((root/'round2-manifest.json').read_text())
          assert data['voice']=='af_bella'
          assert len(data['items'])==5
          assert len(data['variants'])==3
          for item in data['items'].values():
              for src in item['files'].values():
                  p=root/src.removeprefix('./')
                  assert p.exists() and p.stat().st_size>1000,p
          print('Verified 15 Kokoro af_bella round-2 WAVs.')
          PY
      - name: Commit generated samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Verb-Runner/bella-samples/round2-audio Verb-Runner/bella-samples/round2-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verb Runner: generate Bella round 2 samples [generated bella round2]"
          git push origin HEAD:feat/bella-failed-round2
