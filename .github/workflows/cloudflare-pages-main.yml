name: Deploy Classroom Online Games to Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/cog-youteach-assignments-phase1-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and normalize Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN_RAW" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify Verb Runner JavaScript modules
        run: |
          node --check Verb-Runner/coastal-scene-config.mjs
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/prototype.js

      - name: Cache approved external pronunciation assets
        run: python Verb-Runner/scripts/cache-approved-external-pronunciation.py

      - name: Verify approved Verb Runner pronunciation assets
        run: python Verb-Runner/scripts/generate-pronunciation.py

      - name: Run Verb Runner regression tests
        run: |
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R 100-Students-Said OSASCOMP Support-Meter Verb-Runner Engineering teacher dist/

      - name: Ensure Cloudflare Pages project exists
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages project create classroom-online-games --production-branch main || true

      - name: Pin production build settings
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUILD_COMMAND='rm -rf dist && mkdir -p dist && cp index.html dist/ && cp -R 100-Students-Said OSASCOMP Support-Meter Verb-Runner Engineering teacher dist/'
          jq -n --arg cmd "$BUILD_COMMAND" '{
            production_branch:"main",
            build_config:{
              build_command:$cmd,
              destination_dir:"dist",
              root_dir:""
            }
          }' > pages-project.json
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/classroom-online-games" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @pages-project.json > /dev/null

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy dist --project-name=classroom-online-games --branch=${{ github.ref_name == 'main' && 'main' || 'cog-youteach-assignments-phase1-v2' }} --commit-hash=${{ github.sha }}
