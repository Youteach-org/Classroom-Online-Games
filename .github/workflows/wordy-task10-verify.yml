name: Wordy Task 10 Verify

on:
  push:
    branches:
      - feature/wordy-game
    paths:
      - "Wordy/**"
      - ".github/workflows/wordy-task10-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Wordy suite
        run: node --test Wordy/tests/*.test.mjs
      - name: Check Wordy app syntax
        run: node --check Wordy/app.mjs
