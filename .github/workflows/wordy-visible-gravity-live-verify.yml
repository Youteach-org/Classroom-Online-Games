name: Wordy Visible Gravity Live Verify
on:
  push:
    branches:
      - integration/wordy-visible-gravity-20260925
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Verify live POP visibly falls and refills
        run: |
          cat > verify-live-wordy-gravity.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          let verified=null;

          for(const seedStart of [7,29,61,91,123]){
            const context=await browser.newContext({viewport:{width:900,height:900}});
            await context.addInitScript(seed=>{
              let value=seed>>>0;
              Math.random=()=>{
                value=(value*1664525+1013904223)>>>0;
                return value/4294967296;
              };
              window.__wordyAnimations=[];
              const nativeAnimate=Element.prototype.animate;
              Element.prototype.animate=function(keyframes,options){
                window.__wordyAnimations.push({
                  id:this.dataset?.tileId??'',
                  keyframes:Array.from(keyframes??[]).map(frame=>({...frame})),
                  options:{...options}
                });
                return nativeAnimate.call(this,keyframes,options);
              };
            },seedStart);

            const page=await context.newPage();
            const response=await page.goto(
              'https://classroom-online-games.pages.dev/Wordy/?gravity-live='+seedStart+'-'+Date.now(),
              {waitUntil:'networkidle',timeout:30000}
            );
            if(response?.status()!==200)throw new Error('Wordy HTTP '+response?.status());
            await page.waitForFunction(()=>window.WordyPrototype?.controller?.state?.().board?.tiles?.length===49,{timeout:15000});

            const setup=await page.evaluate(async()=>{
              const stamp=Date.now();
              const {RELATIONSHIPS}=await import('/Wordy/data/relationships.mjs?v='+stamp);
              const {createRelationshipBank}=await import('/Wordy/engine/relationship-bank.mjs?v='+stamp);
              const {findImmediateScoringMoves}=await import('/Wordy/engine/generator.mjs?v='+stamp);

              const byId=new Map(RELATIONSHIPS.map(relation=>[relation.id,relation]));
              if(!byId.has('phrasal-verb:keep-up'))throw new Error('live bank missing KEEP UP');
              if(!byId.has('phrasal-verb:keep-in'))throw new Error('live bank missing KEEP IN');

              const controller=window.WordyPrototype.controller;
              const state=controller.state();
              const roundBank=createRelationshipBank(
                state.activeRelationshipIds.map(id=>byId.get(id)).filter(Boolean)
              );
              const moves=findImmediateScoringMoves(state.board,roundBank);
              const choice=moves.find(move=>{
                const removed=new Set(move.matches.flatMap(match=>match.tileIds??[]));
                return [...removed].some(id=>{
                  const removedTile=move.board.tiles.find(tile=>tile.id===id);
                  if(!removedTile)return false;
                  return move.board.tiles.some(tile=>
                    !removed.has(tile.id)&&
                    tile.column===removedTile.column&&
                    tile.row<removedTile.row
                  );
                });
              });
              if(!choice)return {found:false,moves:moves.length};

              const swapResult=controller.attemptSwap(choice.swap.fromTileId,choice.swap.toTileId);
              if(swapResult.status!=='accepted')throw new Error('productive live swap rejected');
              const ready=controller.state();
              if(ready.readyMatches.length===0)throw new Error('live swap did not create READY relationship');
              return {
                found:true,
                moves:moves.length,
                relationshipIds:ready.readyMatches.map(match=>match.relationshipId),
                movesLeft:ready.movesLeft
              };
            });

            if(!setup.found){
              await context.close();
              continue;
            }

            await page.evaluate(()=>{ window.__wordyAnimations=[]; document.querySelector('#popButton')?.click(); });
            await page.waitForFunction(()=>window.__wordyAnimations.some(record=>
              record.keyframes.some(frame=>String(frame.transform??'').startsWith('translateY('))
            ),{timeout:10000});
            await page.waitForTimeout(1200);

            const result=await page.evaluate(()=>{
              const records=window.__wordyAnimations??[];
              const removal=records.find(record=>record.keyframes.some(frame=>String(frame.transform??'').includes('scale')));
              const gravity=records.find(record=>record.keyframes.some(frame=>String(frame.transform??'').startsWith('translate(')));
              const refill=records.find(record=>record.keyframes.some(frame=>String(frame.transform??'').startsWith('translateY(')));
              return {
                phase:window.WordyPrototype.controller.state().phase,
                removal:removal?{id:removal.id,first:removal.keyframes[0]?.transform??''}:null,
                gravity:gravity?{id:gravity.id,first:gravity.keyframes[0]?.transform??'',duration:gravity.options.duration}:null,
                refill:refill?{id:refill.id,first:refill.keyframes[0]?.transform??'',duration:refill.options.duration}:null,
                totalAnimations:records.length
              };
            });

            if(!result.removal)throw new Error('live POP has no removal animation');
            if(!result.gravity)throw new Error('live POP has no gravity animation');
            if(!result.refill)throw new Error('live POP has no refill animation');

            const gravityDy=Number(result.gravity.first.match(/,(-?[0-9.]+)px\)/)?.[1]);
            const refillDy=Number(result.refill.first.match(/translateY\((-?[0-9.]+)px\)/)?.[1]);
            if(!(gravityDy<0))throw new Error('live gravity does not fall downward: '+result.gravity.first);
            if(!(refillDy<0))throw new Error('live refill does not enter from above: '+result.refill.first);
            if(result.phase!=='playing'&&result.phase!=='result')throw new Error('live POP left invalid phase '+result.phase);

            verified={seed:seedStart,setup,result,gravityDy,refillDy};
            await context.close();
            break;
          }

          if(!verified)throw new Error('could not find deterministic live move with a falling survivor');
          console.log(JSON.stringify(verified,null,2));
          console.log('LIVE_VISIBLE_GRAVITY_OK');
          await browser.close();
          EOF
          node verify-live-wordy-gravity.mjs
