name: Repair Reported ChatGPT Handoff Test

on:
  push:
    branches:
      - feature/repair-reported-chatgpt-handoff

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pronunciation review tests
        run: node --test Verb-Runner/tests/pronunciation-review.test.mjs
