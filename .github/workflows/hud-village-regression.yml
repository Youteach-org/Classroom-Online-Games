name: HUD Village Regression

on:
  push:
    branches:
      - fix/hud-village-empty-gap
    paths:
      - "Verb-Runner/index.html"
      - "Verb-Runner/styles.css"
      - "Verb-Runner/coastal-world.mjs"
      - "Verb-Runner/tests/hud-village-layout.test.mjs"
      - ".github/workflows/hud-village-regression.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HUD and village regression tests
        run: node --test Verb-Runner/tests/hud-village-layout.test.mjs
