name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/verb-runner-v2-prototype
    paths:
      - 'Verb-Runner/**'
      - 'Verb-Runner-V2/**'
      - 'index.html'
      - '.github/workflows/cloudflare-pages.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy COG preview to Cloudflare Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch=feature/verb-runner-v2-prototype
            --commit-hash=${{ github.sha }}
            --commit-message="${{ github.event.head_commit.message || 'Manual Cloudflare Pages deployment' }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
