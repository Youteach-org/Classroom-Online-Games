name: Oral Grader - Gemini credential preflight

on:
  push:
    branches:
      - feature/oral-grader-v1-20260922
    paths:
      - .github/workflows/og-credential-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gemini-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured Gemini credential without exposing its value
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          api_key="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
          if [[ -z "$api_key" ]]; then
            echo "Oral Grader Gemini credential is not available in Actions." >&2
            exit 1
          fi
          status=$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "x-goog-api-key: $api_key" \
            'https://generativelanguage.googleapis.com/v1beta/models')
          if [[ "$status" != "200" ]]; then
            echo "Gemini API refused preflight with HTTP status ${status}." >&2
            exit 2
          fi
          echo "Gemini API accepted the configured Actions credential."
