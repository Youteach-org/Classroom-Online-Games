name: Oral Grader - Gemini credential preflight

on:
  push:
    branches:
      - feature/oral-grader-v1-20260922
    paths:
      - .github/workflows/og-credential-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gemini-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured Gemini credential without exposing its value
        env:
          GEMINI_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' || secrets.GOOGLE_API_KEY != '' }}
        shell: bash
        run: |
          if [[ "$GEMINI_CONFIGURED" != "true" ]]; then
            echo "Oral Grader Gemini credential is not available in Actions." >&2
            exit 1
          fi
          echo "Oral Grader Gemini credential is available in Actions."
