name: Pronunciation Latency Test

on:
  push:
    branches:
      - fix/pronunciation-latency
    paths:
      - "Verb-Runner/pronunciation.js"
      - "Verb-Runner/prototype.js"
      - "Verb-Runner/tests/pronunciation.test.mjs"
      - ".github/workflows/pronunciation-latency-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pronunciation tests
        run: node --test Verb-Runner/tests/pronunciation.test.mjs
