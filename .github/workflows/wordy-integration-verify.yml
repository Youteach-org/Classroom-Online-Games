name: Wordy Integration Verify
on:
  push:
    branches:
      - integration/wordy-uniform-cell-20260924
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full Wordy suite
        run: node --test Wordy/tests/*.test.mjs
      - name: Syntax check
        run: node --check Wordy/app.mjs
      - name: Verify production packaging contract
        run: |
          grep -q "Wordy" .github/workflows/cloudflare-pages-main.yml
          rm -rf dist-check
          mkdir -p dist-check
          cp -R Wordy dist-check/
          test -f dist-check/Wordy/index.html
          test -f dist-check/Wordy/engine/board.mjs
          test ! -f dist-check/Wordy/engine/tile-size.mjs
