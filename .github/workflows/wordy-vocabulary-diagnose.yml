name: Wordy Vocabulary Diagnose
on:
  push:
    branches:
      - feature/wordy-game
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Measure pool diversity and board feasibility
        run: |
          node --input-type=module <<'EOF'
          import { RELATIONSHIPS } from './Wordy/data/relationships.mjs';
          import { createRelationshipBank } from './Wordy/engine/relationship-bank.mjs';
          import { createControlledBoard, selectRelationshipNeighborhood, findImmediateScoringMoves, relationshipCoverage } from './Wordy/engine/generator.mjs';

          const bank=createRelationshipBank(RELATIONSHIPS);
          const seeded=seed=>()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

          for(const size of [16,20,24,28,32]){
            for(const seed of [3,17,27,41,73]){
              let ids;
              try{
                ids=selectRelationshipNeighborhood({bank,rng:seeded(seed),size});
              }catch(error){
                console.log(JSON.stringify({size,seed,error:'POOL '+error.message}));
                continue;
              }
              const activeWords=new Set(ids.flatMap(id=>bank.byId.get(id).tokens));
              const result={size,seed,activeUniqueWords:activeWords.size};
              for(const maxCopies of [2,3]){
                try{
                  const board=createControlledBoard({
                    bank,relationshipIds:ids,rows:7,columns:7,rng:seeded(seed+100),
                    minScoringMoves:8,minProductiveRows:4,minProductiveColumns:4,
                    minRelationshipCoverage:0.85,maxTokenCopies:maxCopies,allowStartingMatches:false
                  });
                  const counts=new Map();
                  for(const tile of board.tiles)counts.set(tile.word,(counts.get(tile.word)||0)+1);
                  const sorted=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
                  result['copies'+maxCopies]={
                    unique:counts.size,
                    max:sorted[0]?.[1]||0,
                    moves:findImmediateScoringMoves(board,bank).length,
                    coverage:+relationshipCoverage(board,bank,ids).toFixed(3),
                    top:sorted.slice(0,6)
                  };
                }catch(error){
                  result['copies'+maxCopies]={error:error.message};
                }
              }
              console.log(JSON.stringify(result));
            }
          }
          EOF
