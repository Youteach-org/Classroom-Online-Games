name: Wordy Vocabulary Diagnose
on:
  push:
    branches:
      - feature/wordy-game
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Measure real A-G board diversity
        run: |
          node --input-type=module <<'EOF'
          import { RELATIONSHIPS } from './Wordy/data/relationships.mjs';
          import { LEVELS } from './Wordy/data/levels.mjs';
          import { createRelationshipBank } from './Wordy/engine/relationship-bank.mjs';
          import { createGameController } from './Wordy/engine/controller.mjs';
          import { findImmediateScoringMoves } from './Wordy/engine/generator.mjs';

          const bank=createRelationshipBank(RELATIONSHIPS);
          const seeded=seed=>()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

          for(const level of LEVELS){
            for(const seed of [7,29,61]){
              const game=createGameController({
                bank,levels:LEVELS,initialLevelId:level.id,rng:seeded(seed),storage:null
              });
              const state=game.state();
              const counts=new Map();
              for(const tile of state.board.tiles)counts.set(tile.word,(counts.get(tile.word)||0)+1);
              const sorted=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
              console.log(JSON.stringify({
                level:level.id,seed,
                pool:state.activeRelationshipIds.length,
                uniqueWords:counts.size,
                maxCopies:sorted[0]?.[1]||0,
                productiveMoves:findImmediateScoringMoves(state.board,bank).length,
                top:sorted.slice(0,8)
              }));
            }
          }
          EOF
