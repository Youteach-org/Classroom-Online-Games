name: Generate reviewed pronunciation replacements

on:
  push:
    branches:
      - feat/pronunciation-reviewed-replacements
    paths:
      - "Verb-Runner/pronunciation-corrections.json"
      - "Verb-Runner/scripts/generate-pronunciation.py"
      - "Verb-Runner/tests/pronunciation-corrections.test.mjs"
      - ".github/workflows/pronunciation-reviewed-replacements.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronunciation-reviewed-replacements
  cancel-in-progress: true

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated reviewed audio]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro Bella generator
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro>=0.9.4" numpy soundfile

      - name: Verify correction specification
        run: |
          node --test Verb-Runner/tests/pronunciation-corrections.test.mjs
          node --test Verb-Runner/tests/pronunciation-policy.test.mjs
          node --test Verb-Runner/tests/pronunciation.test.mjs

      - name: Generate reviewed Kokoro Bella replacements
        env:
          ALLOW_KOKORO_BELLA_GENERATION: "1"
        run: |
          python Verb-Runner/scripts/generate-pronunciation.py

      - name: Verify generated replacement set
        run: |
          node --test Verb-Runner/tests/pronunciation-corrections.test.mjs
          node --test Verb-Runner/tests/pronunciation-policy.test.mjs
          node --test Verb-Runner/tests/pronunciation.test.mjs
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('Verb-Runner')
          spec=json.loads((root/'pronunciation-corrections.json').read_text())
          text=(root/'pronunciation-manifest.js').read_text()
          payload=text.split('=',1)[1].rsplit(';})',1)[0]
          manifest=json.loads(payload)
          assert len(spec['items']) == 42
          for key in spec['items']:
              src=manifest[key]
              assert src.startswith('./audio/pronunciation/'), (key,src)
              path=root/src.removeprefix('./')
              assert path.exists() and path.stat().st_size>1000, (key,path)
          print('Verified 42 local reviewed replacement assets; blew kept unchanged as correct.')
          PY

      - name: Commit generated replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Verb-Runner/audio/pronunciation Verb-Runner/pronunciation-manifest.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Verb Runner: generate 42 validated pronunciation replacements [generated reviewed audio]"
          git push origin HEAD:feat/pronunciation-reviewed-replacements
