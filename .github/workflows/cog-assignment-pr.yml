name: Verify YouTeach COG assignment launch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Verb-Runner/**'
      - '.github/workflows/cog-assignment-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Verb Runner JavaScript
        run: |
          node --check Verb-Runner/session-sync.js
          node --check Verb-Runner/prototype.js

      - name: Run Verb Runner regression tests
        run: |
          node --test Verb-Runner/tests/*.test.mjs
          node --test Verb-Runner/sentence-run.test.js

      - name: Prepare preview site
        if: github.event_name == 'pull_request'
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R 100-Students-Said OSASCOMP Support-Meter Verb-Runner Engineering teacher dist/

      - name: Normalize Cloudflare account ID for preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy COG preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=classroom-online-games \
            --branch="${{ github.head_ref }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}"

      - name: Smoke test COG preview
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW='https://feature-youteach-cog-assignm.classroom-online-games.pages.dev'
          curl -fsS --retry 5 --retry-delay 2 "$PREVIEW/Verb-Runner/" -o /tmp/verb-runner.html
          grep -q 'prototype.js' /tmp/verb-runner.html
          curl -fsS --retry 5 --retry-delay 2 "$PREVIEW/Verb-Runner/session-sync.js" -o /tmp/session-sync.js
          grep -q 'resolveYouTeachAssignmentLaunchToken' /tmp/session-sync.js
          curl -fsS --retry 5 --retry-delay 2 "$PREVIEW/Verb-Runner/prototype.js" -o /tmp/prototype.js
          grep -q 'assignmentLaunch' /tmp/prototype.js
          grep -q 'REOPEN FROM YOUTEACH' /tmp/prototype.js
