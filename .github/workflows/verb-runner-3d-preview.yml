name: Deploy Verb Runner 3D Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Verb-Runner/coastal-world.mjs'
      - 'Verb-Runner/coastal-scene-config.mjs'
      - 'Verb-Runner/coastal-preview.html'
      - 'Verb-Runner/coastal-preview.mjs'
      - 'Verb-Runner/tests/coastal-world-v2.test.mjs'
      - 'Verb-Runner/tests/coastal-world-v3.test.mjs'
      - 'Verb-Runner/tests/coastal-world-v4.test.mjs Verb-Runner/tests/coastal-world-v5.test.mjs'
      - 'Verb-Runner/tests/coastal-world-v5.test.mjs'
      - '.github/workflows/verb-runner-3d-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate preview modules
        run: |
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/coastal-preview.mjs

      - name: Run coastal visual acceptance tests
        run: |
          node --test Verb-Runner/tests/coastal-world-v2.test.mjs Verb-Runner/tests/coastal-world-v3.test.mjs Verb-Runner/tests/coastal-world-v4.test.mjs

      - name: Prepare preview
        run: |
          rm -rf preview-dist
          mkdir preview-dist
          cp Verb-Runner/coastal-preview.html preview-dist/index.html
          cp Verb-Runner/coastal-preview.mjs preview-dist/
          cp Verb-Runner/coastal-world.mjs preview-dist/
          cp Verb-Runner/coastal-scene-config.mjs preview-dist/

      - name: Normalize Cloudflare account ID
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy preview branch to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy preview-dist --project-name=classroom-online-games --branch=vr-3d-preview --commit-hash=${{ github.sha }}

      - name: Capture deployed preview screenshot
        timeout-minutes: 2
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          cat > capture-preview.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({
              headless:true,
              executablePath:process.env.BROWSER,
              args:['--no-sandbox','--disable-gpu']
            });
            const page=await browser.newPage({viewport:{width:1536,height:864}});
            await page.goto('https://vr-3d-preview.classroom-online-games.pages.dev',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(6500);
            await page.screenshot({path:'verb-runner-coastal-preview.png'});
            await browser.close();
          })();
          NODE
          npm install --no-save --no-package-lock playwright
          BROWSER="$BROWSER" node capture-preview.cjs
          test -s verb-runner-coastal-preview.png

      - name: Upload preview screenshot
        uses: actions/upload-artifact@v4
        with:
          name: verb-runner-coastal-preview
          path: verb-runner-coastal-preview.png
          retention-days: 7
