name: Deploy Verb Runner 3D Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Verb-Runner/coastal-world.mjs'
      - 'Verb-Runner/coastal-scene-config.mjs'
      - 'Verb-Runner/coastal-preview.html'
      - 'Verb-Runner/coastal-preview.mjs'
      - 'Verb-Runner/tests/coastal-world-v2.test.mjs'
      - 'Verb-Runner/tests/coastal-world-v3.test.mjs'
      - '.github/workflows/verb-runner-3d-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate preview modules
        run: |
          node --check Verb-Runner/coastal-world.mjs
          node --check Verb-Runner/coastal-preview.mjs

      - name: Run coastal visual acceptance tests
        run: |
          node --test Verb-Runner/tests/coastal-world-v2.test.mjs Verb-Runner/tests/coastal-world-v3.test.mjs

      - name: Prepare preview
        run: |
          rm -rf preview-dist
          mkdir preview-dist
          cp Verb-Runner/coastal-preview.html preview-dist/index.html
          cp Verb-Runner/coastal-preview.mjs preview-dist/
          cp Verb-Runner/coastal-world.mjs preview-dist/
          cp Verb-Runner/coastal-scene-config.mjs preview-dist/

      - name: Normalize Cloudflare account ID
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy preview branch to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy preview-dist --project-name=classroom-online-games --branch=vr-3d-preview --commit-hash=${{ github.sha }}
